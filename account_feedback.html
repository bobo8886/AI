<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号疑似反馈 / 申诉</title>
  <style>
    :root{
      --base-unit: min(1.6vh, 1.2vw);
      --primary-color: #00c6ff;
      --secondary-color: #0072ff;
      --accent-color: #00ffcc;
      --bg-dark: #0a192f;
      --bg-darker: #020c1b;
      --card-bg: rgba(10, 25, 47, 0.82);
      --text-primary: #e6f1ff;
      --text-secondary: #ccd6f6;
      --shadow: 0 18px 60px rgba(0,114,255,0.18);
      --border: 1px solid rgba(0,198,255,0.22);
    }
    body{
      margin:0;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      min-height:100vh;
      background: var(--bg-darker);
      color: var(--text-primary);
      overflow-x:hidden;
    }
    .background{
      position:fixed; inset:0;
      z-index:0;
      overflow:hidden;
    }
    .tech-bg{
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%),
        linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%);
      filter: blur(18px);
      opacity: .85;
      animation: bgPulse 10s ease-in-out infinite;
    }
    @keyframes bgPulse{
      0%,100%{ transform: scale(1); }
      50%{ transform: scale(1.04); }
    }
    .grid-lines{
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: .25;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove{
      0%{ transform: translateY(0); }
      100%{ transform: translateY(40px); }
    }
    #particles .tech-particle{
      position:absolute;
      border-radius:50%;
      background: rgba(0, 198, 255, 0.8);
      box-shadow: 0 0 10px rgba(0, 198, 255, 0.6);
      animation: floatUp linear infinite;
      pointer-events:none;
    }
    @keyframes floatUp{
      from{ transform: translateY(0); }
      to{ transform: translateY(-120vh); }
    }

    .container{
      position:relative;
      z-index:2;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px 16px;
    }
    .card{
      width: min(560px, 100%);
      background: linear-gradient(135deg, rgba(10, 25, 47, 0.92), rgba(2, 12, 27, 0.92));
      border-radius: 18px;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 28px;
      backdrop-filter: blur(10px);
      transform: translateY(8px);
      opacity: 0;
      animation: cardIn .35s ease forwards;
    }
    @keyframes cardIn{
      to{ transform: translateY(0); opacity:1; }
    }
    .title{
      margin: 0 0 10px 0;
      font-size: 1.6rem;
      background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
      text-shadow: 0 0 10px rgba(0,198,255,0.22);
    }
    .desc{
      margin: 0 0 18px 0;
      color: var(--text-secondary);
      line-height:1.7;
      font-size: 0.98rem;
    }
    .row{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .field{
      flex:1;
      min-width: 220px;
      margin-bottom: 12px;
    }
    label{
      display:block;
      margin-bottom:6px;
      color: rgba(230,241,255,0.92);
      font-size: .95rem;
    }
    input, textarea{
      width:100%;
      box-sizing:border-box;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0,198,255,0.22);
      background: rgba(10,25,47,0.65);
      color: var(--text-primary);
      outline:none;
      transition: box-shadow .2s ease, border-color .2s ease, transform .2s ease;
    }
    input:focus, textarea:focus{
      border-color: rgba(0,255,204,0.55);
      box-shadow: 0 0 0 4px rgba(0,255,204,0.12);
    }
    textarea{ min-height: 110px; resize: vertical; }
    .fileHint{
      margin-top: 6px;
      font-size: .85rem;
      color: rgba(204,214,246,0.9);
    }
    .actions{
      display:flex;
      justify-content:center;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(0,198,255,0.14);
    }
    .btn{
      padding: 11px 22px;
      border-radius: 12px;
      border: none;
      cursor:pointer;
      font-size: 1rem;
      color:#fff;
      background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
      box-shadow: 0 14px 30px rgba(0,198,255,0.18);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 44px rgba(0,198,255,0.24);
      filter: brightness(1.03);
    }
    .btn.secondary{
      background: rgba(0,198,255,0.12);
      border: 1px solid rgba(0,198,255,0.28);
      box-shadow: none;
      color: var(--text-primary);
    }
    .btn.secondary:hover{
      box-shadow: 0 18px 44px rgba(0,198,255,0.10);
    }
    .msg{
      margin-top: 12px;
      text-align:center;
      color: var(--text-secondary);
      min-height: 20px;
    }
  </style>

<script src="static/mock-api.js"></script>
</head>
<body>
  <div class="background">
    <div class="tech-bg"></div>
    <div class="grid-lines"></div>
    <div id="particles"></div>
  </div>

  <div class="container">
    <div class="card">
      <h1 class="title">账号疑似反馈 / 申诉</h1>
      <p class="desc">若你认为封禁有误，或需要提交相关证明，请填写以下信息。管理员处理后会在后台执行继续封禁（疑似造假）或解除封禁。</p>

      <form id="afForm">
        <div class="row">
          <div class="field">
            <label>账号名称（用户名）</label>
            <input name="username" id="afUsername" placeholder="请输入账号名称" required />
          </div>
          <div class="field">
            <label>邮箱</label>
            <input name="email" id="afEmail" placeholder="请输入邮箱" required />
          </div>
        </div>
        <div class="field">
          <label>封禁截图（可选）</label>
          <input type="file" name="evidence" id="afEvidence" accept="image/*" />
          <div class="fileHint">支持 png/jpg/jpeg/gif/webp，建议上传封禁通知截图。</div>
        </div>
        <div class="field">
          <label>理由 / 说明</label>
          <textarea name="reason" id="afReason" placeholder="请描述你的申诉理由或补充说明（必填）" required></textarea>
        </div>

        <div class="actions">
          <button type="button" class="btn secondary" onclick="window.location.href='login.html'">返回登录</button>
          <button type="submit" class="btn">提交</button>
        </div>
        <div class="msg" id="afMsg"></div>
      </form>
    </div>
  </div>

  <script>
    function createTechParticles() {
      const container = document.getElementById('particles');
      if (!container) return;
      container.innerHTML = '';
      const count = Math.max(60, Math.floor(window.innerWidth / 6));
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'tech-particle';
        const size = Math.random() * 3 + 1;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (Math.random() * 120 + 10) + '%';
        p.style.opacity = (Math.random() * 0.45 + 0.35).toFixed(2);
        p.style.animationDuration = (Math.random() * 16 + 10).toFixed(2) + 's';
        p.style.animationDelay = (Math.random() * 8).toFixed(2) + 's';
        container.appendChild(p);
      }
    }
    window.addEventListener('resize', () => {
      clearTimeout(window.__afParticleTimer);
      window.__afParticleTimer = setTimeout(createTechParticles, 200);
    });
    createTechParticles();

    document.getElementById('afForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('afMsg');
      msg.textContent = '提交中...';
      const fd = new FormData();
      fd.append('username', document.getElementById('afUsername').value.trim());
      fd.append('email', document.getElementById('afEmail').value.trim());
      fd.append('reason', document.getElementById('afReason').value.trim());
      const f = document.getElementById('afEvidence').files[0];
      if (f) fd.append('evidence', f);
      try {
        const res = await fetch('/api/account_feedback', { method: 'POST', body: fd });
        const data = await res.json();
        if (res.ok) {
          msg.textContent = data.message || '提交成功';
          setTimeout(() => { window.location.href = 'login.html'; }, 1200);
        } else {
          msg.textContent = data.error || '提交失败';
        }
      } catch (err) {
        msg.textContent = '网络错误，请稍后重试';
      }
    });
  </script>
</body>
</html>
