<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号疑似反馈 - 管理</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --primary-color: #00c6ff;
      --secondary-color: #0072ff;
      --accent-color: #00ffcc;
      --bg-dark: #0a192f;
      --bg-darker: #020c1b;
      --card-bg: rgba(10, 25, 47, 0.82);
      --text-primary: #e6f1ff;
      --text-secondary: #ccd6f6;
      --shadow: 0 18px 60px rgba(0,114,255,0.18);
      --border: 1px solid rgba(0,198,255,0.22);
    }
    body{
      margin:0;
      font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background: var(--bg-darker);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x:hidden;
    }
    .background{
      position:fixed; inset:0;
      z-index:0; overflow:hidden;
    }
    .tech-bg{
      position:absolute; inset:0;
      background:
        radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%),
        linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%);
      filter: blur(18px);
      opacity: .85;
      animation: bgPulse 10s ease-in-out infinite;
    }
    @keyframes bgPulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.04)} }
    .grid-lines{
      position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: .25;
      animation: gridMove 20s linear infinite;
    }
    @keyframes gridMove{ 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
    #particles .tech-particle{
      position:absolute;
      border-radius:50%;
      background: rgba(0, 198, 255, 0.8);
      box-shadow: 0 0 10px rgba(0, 198, 255, 0.6);
      animation: floatUp linear infinite;
      pointer-events:none;
    }
    @keyframes floatUp{ from{transform:translateY(0)} to{transform:translateY(-120vh)} }

    .topbar{
      position: sticky;
      top:0;
      z-index: 3;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 14px 18px;
      background: rgba(2,12,27,0.65);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0,198,255,0.12);
    }
    .topbar .title{
      display:flex;
      gap:10px;
      align-items:center;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .topbar .title i{ color: var(--primary-color); }
    .topbar .actions{ display:flex; gap:10px; }
    .btn{
      padding: 9px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,198,255,0.22);
      background: rgba(0,198,255,0.08);
      color: var(--text-primary);
      cursor:pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 44px rgba(0,198,255,0.10);
      background: rgba(0,198,255,0.12);
    }
    .container{
      position:relative;
      z-index:2;
      padding: 18px 18px 28px 18px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .panel{
      background: linear-gradient(135deg, rgba(10, 25, 47, 0.92), rgba(2, 12, 27, 0.92));
      border-radius: 18px;
      border: var(--border);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      padding: 16px 18px;
      border-bottom: 1px solid rgba(0,198,255,0.12);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .panelHead .hint{ color: var(--text-secondary); font-size:.9rem; }
    .list{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
      padding: 16px;
    }
    .item{
      background: rgba(0, 198, 255, 0.04);
      border: 1px solid rgba(0,198,255,0.12);
      border-radius: 16px;
      padding: 14px 14px 12px 14px;
      box-shadow: 0 14px 40px rgba(0,114,255,0.10);
      backdrop-filter: blur(8px);
      overflow:hidden;
    }
    .itemHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0,198,255,0.10);
      margin-bottom: 12px;
    }
    .itemHeadActions{
      display:flex;
      flex-wrap:wrap;
      flex-direction:column;
      gap: 8px;
      align-items:flex-end;
      min-width: 0;
    }
    .itemHeadActions .miniBtn{ white-space: nowrap; }
    .itemTitle{
      font-weight: 800;
      letter-spacing: .4px;
      line-height: 1.35;
      word-break: break-word;
    }
    .meta{
      color: var(--text-secondary);
      font-size: .88rem;
      line-height: 1.6;
      margin-top: 6px;
      word-break: break-word;
    }
    .cols{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .kv{
      background: rgba(10,25,47,0.45);
      border: 1px solid rgba(0,198,255,0.10);
      border-radius: 14px;
      padding: 10px 10px;
    }
    .kv .k{
      color: rgba(230,241,255,0.92);
      font-size: .9rem;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .kv .v{
      color: rgba(255,255,255,0.90);
      font-size: .95rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .opsRow{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
      justify-content:flex-start;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(0,198,255,0.10);
    }
    .miniBtn{
      padding: 9px 12px;
      border-radius: 12px;
      border: 1px solid rgba(0,198,255,0.18);
      background: rgba(0,198,255,0.08);
      color: var(--text-primary);
      cursor:pointer;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      font-weight: 650;
    }
    .miniBtn:hover{
      transform: translateY(-1px);
      box-shadow: 0 18px 44px rgba(0,198,255,0.10);
      background: rgba(0,198,255,0.12);
    }
    .miniBtn.primary{
      border: none;
      color:#fff;
      background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
      box-shadow: 0 14px 30px rgba(0,198,255,0.14);
    }
    .miniBtn.primary:hover{
      box-shadow: 0 18px 44px rgba(0,198,255,0.18);
    }
    .miniBtn.danger{
      background: rgba(255,87,34,0.14);
      border: 1px solid rgba(255,87,34,0.40);
      color:#ffb199;
      box-shadow: none;
    }
    .miniBtn.danger:hover{
      box-shadow: 0 18px 44px rgba(255,87,34,0.10);
    }
    .tag{
      display:inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(0,198,255,0.22);
      background: rgba(0,198,255,0.08);
      color: var(--text-primary);
      font-size: .85rem;
      margin-left: 6px;
    }
    .tag.bad{ border-color: rgba(255,87,34,0.4); background: rgba(255,87,34,0.12); color:#ffb199; }
    .tag.ghost{ border-color: rgba(150,150,180,0.35); background: rgba(150,150,180,0.08); color: rgba(204,214,246,0.85); }
    .item.noMatch{ border-color: rgba(255,193,7,0.2); background: rgba(255,193,7,0.03); }
    .miniBtn.delete{
      background: rgba(120,120,140,0.12);
      border: 1px solid rgba(150,150,180,0.3);
      color: rgba(204,214,246,0.9);
    }
    .miniBtn:disabled{
      opacity: .5;
      cursor: not-allowed;
      pointer-events: none;
    }
    .miniBtn.delete:hover{
      background: rgba(255,87,34,0.12);
      border-color: rgba(255,87,34,0.35);
      color: #ffb199;
    }
    .emptyState{
      text-align: center;
      padding: 48px 24px;
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.7;
    }
    .emptyState i{ font-size: 2.5rem; color: rgba(0,198,255,0.4); margin-bottom: 12px; display: block; }
    .ops{
      display:flex;
      flex-direction: column;
      gap: 8px;
      min-width: 160px;
    }
    .opBtn{
      padding: 9px 12px;
      border-radius: 12px;
      border: none;
      cursor:pointer;
      color:#fff;
      background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
      transition: transform .18s ease, box-shadow .18s ease;
      box-shadow: 0 14px 30px rgba(0,198,255,0.14);
    }
    .opBtn:hover{ transform: translateY(-1px); box-shadow: 0 18px 44px rgba(0,198,255,0.18); }
    .opBtn.danger{
      background: rgba(255,87,34,0.16);
      border: 1px solid rgba(255,87,34,0.42);
      box-shadow: none;
      color:#ffb199;
    }
    .opBtn.danger:hover{ box-shadow: 0 18px 44px rgba(255,87,34,0.10); }
    .small{
      color: var(--text-secondary);
      font-size: .86rem;
      line-height: 1.6;
      margin-top: 6px;
    }
    .imgLink{
      color: var(--primary-color);
      text-decoration: underline;
      cursor:pointer;
      font-weight: 600;
    }

    /* modal */
    .modal{
      display:none;
      position:fixed; inset:0;
      z-index: 10000;
      background: rgba(2,12,27,0.92);
      backdrop-filter: blur(10px);
      opacity:0;
      transition: opacity .55s ease;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    .modal.show{ display:flex; }
    .modal.open{ opacity:1; }
    .modalCard{
      width: min(560px, 100%);
      background: linear-gradient(135deg, rgba(10, 25, 47, 0.92), rgba(2, 12, 27, 0.92));
      border-radius: 18px;
      border: var(--border);
      box-shadow: var(--shadow);
      padding: 18px;
      transform: translateY(12px) scale(0.98);
      opacity:0;
      transition: transform .55s ease, opacity .55s ease;
    }
    .modal.open .modalCard{ transform: translateY(0) scale(1); opacity:1; }
    .modalRow{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px; }
    select, textarea, input{
      width:100%;
      box-sizing:border-box;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0,198,255,0.22);
      background: rgba(10,25,47,0.65);
      color: var(--text-primary);
      outline:none;
    }
    textarea{ min-height: 90px; resize: vertical; }
    .modalActions{ display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px; margin-top: 12px; }
  </style>

<script src="static/mock-api.js"></script>
</head>
<body>
  <div class="background">
    <div class="tech-bg"></div>
    <div class="grid-lines"></div>
    <div id="particles"></div>
  </div>

  <div class="topbar">
    <div class="title"><i class="fas fa-flag"></i>账号疑似反馈</div>
    <div class="actions">
      <button class="btn" onclick="window.location.href='admin.html'"><i class="fas fa-arrow-left"></i> 返回控制面板</button>
      <button class="btn" onclick="loadData(true)"><i class="fas fa-rotate"></i> 刷新</button>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <div class="panelHead">
        <div>用户提交列表</div>
        <div class="hint" id="countHint">加载中...</div>
      </div>
      <div id="list" class="list"></div>
      <div id="emptyState" class="emptyState" style="display:none;">
        <i class="fas fa-inbox"></i>
        暂无反馈记录，匿名或无效提交可在此页手动删除以释放空间。
      </div>
    </div>
  </div>

  <div class="modal" id="actionModal">
    <div class="modalCard">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:700;">处理账号疑似反馈</div>
        <button class="btn" style="padding:6px 10px;" onclick="closeModal()"><i class="fas fa-xmark"></i></button>
      </div>
      <div class="small" id="modalUser"></div>

      <div class="modalRow">
        <div style="flex:1; min-width: 220px;">
          <div class="small" style="margin-bottom:6px;">继续封禁时长</div>
          <select id="banDuration">
            <option value="1d">1 天</option>
            <option value="3d">3 天</option>
            <option value="5d">5 天</option>
            <option value="1w">1 周</option>
            <option value="2w">2 周</option>
            <option value="3w">3 周</option>
            <option value="1m">1 个月</option>
          </select>
        </div>
        <div style="flex:1; min-width: 220px;">
          <div class="small" style="margin-bottom:6px;">封禁原因</div>
          <input id="banReason" placeholder="默认：疑似造假，继续限时封禁" />
        </div>
      </div>
      <div style="margin-top:10px;">
        <div class="small" style="margin-bottom:6px;">管理员备注（可选）</div>
        <textarea id="adminNote" placeholder="可填写处理说明（可选）"></textarea>
      </div>

      <div class="modalActions">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="opBtn danger" onclick="submitAction('continue_ban')"><i class="fas fa-ban"></i> 继续封禁（疑似造假）</button>
        <button class="opBtn" onclick="submitAction('unban')"><i class="fas fa-unlock"></i> 解除封禁</button>
      </div>
    </div>
  </div>

  <script>
    function createTechParticles() {
      const container = document.getElementById('particles');
      if (!container) return;
      container.innerHTML = '';
      const count = Math.max(80, Math.floor(window.innerWidth / 6));
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'tech-particle';
        const size = Math.random() * 3 + 1;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = (Math.random() * 100) + '%';
        p.style.top = (Math.random() * 120 + 10) + '%';
        p.style.opacity = (Math.random() * 0.45 + 0.35).toFixed(2);
        p.style.animationDuration = (Math.random() * 16 + 10).toFixed(2) + 's';
        p.style.animationDelay = (Math.random() * 8).toFixed(2) + 's';
        container.appendChild(p);
      }
    }
    window.addEventListener('resize', () => {
      clearTimeout(window.__afpTimer);
      window.__afpTimer = setTimeout(createTechParticles, 200);
    });
    createTechParticles();

    let cache = [];
    let currentId = null;

    function esc(s){ return String(s || '').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function escAttr(s){
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function loadData(force){
      const list = document.getElementById('list');
      const emptyState = document.getElementById('emptyState');
      if (force) list.innerHTML = '';
      const res = await fetch('/api/admin/account_feedbacks', { credentials: 'same-origin' });
      const data = await res.json();
      if (!res.ok) {
        alert((data && data.error) || '加载失败，请确认已以管理员身份登录');
        return;
      }
      cache = Array.isArray(data) ? data : [];
      document.getElementById('countHint').textContent = `共 ${cache.length} 条`;
      if (cache.length === 0) {
        list.innerHTML = '';
        if (emptyState) emptyState.style.display = 'block';
        return;
      }
      if (emptyState) emptyState.style.display = 'none';
      list.innerHTML = cache.map(it => {
        const statTag = it.status === '已处理' ? `<span class="tag">已处理</span>` : `<span class="tag bad">待处理</span>`;
        const banTag = it.is_banned ? `<span class="tag bad">已封禁</span>` : `<span class="tag">未封禁</span>`;
        const canHandle = !!it.matched_user_id;
        const noMatchTag = !canHandle ? `<span class="tag ghost">未匹配用户</span>` : '';
        const handleHint = canHandle
          ? `匹配用户：${esc(it.matched_username || it.username)}（ID：${it.matched_user_id}）`
          : '未匹配到系统用户（请核对用户名/邮箱，或删除无效记录）';
        const imgBtn = it.image_path
          ? `<button type="button" class="miniBtn" data-action="view-image" data-image="${escAttr(it.image_path)}"><i class="fas fa-image"></i> 截图</button>`
          : '';
        const itemClass = canHandle ? 'item' : 'item noMatch';
        const handled = it.handled_at ? `处理时间：${esc(it.handled_at)}` : '';
        const adminNote = it.admin_note ? `管理员备注：${esc(it.admin_note)}` : '';
        const banReason = esc(it.ban_reason || '—');
        const banUntil = esc(it.banned_until || '—');
        const handleDisabled = canHandle ? '' : 'disabled';
        return `
          <div class="${itemClass}" data-id="${it.id}">
            <div class="itemHead">
              <div>
                <div class="itemTitle">${esc(it.username)} ${statTag} ${noMatchTag}</div>
                <div class="meta">提交时间：${esc(it.created_at)} · 邮箱：${esc(it.email)}<br>${esc(handleHint)} ${banTag}</div>
              </div>
              <div class="itemHeadActions">
                ${imgBtn}
                <button type="button" class="miniBtn primary" data-action="open-modal" data-id="${it.id}" data-username="${escAttr(it.username)}" ${handleDisabled}><i class="fas fa-gavel"></i> 处理</button>
                <button type="button" class="miniBtn delete" data-action="delete" data-id="${it.id}" title="删除后不可恢复，可清理匿名/无效提交"><i class="fas fa-trash-alt"></i> 删除记录</button>
              </div>
            </div>

            <div class="cols">
              <div class="kv">
                <div class="k">用户提交理由 / 说明</div>
                <div class="v">${esc(it.reason || '—')}</div>
              </div>
              <div class="kv">
                <div class="k">当前封禁信息</div>
                <div class="v">封禁原因：${banReason}\n封禁到期：${banUntil}${handled ? '\n' + handled : ''}${adminNote ? '\n' + adminNote : ''}</div>
              </div>
            </div>

            <div class="opsRow">
              <button type="button" class="miniBtn danger" data-action="continue-ban" data-id="${it.id}" data-username="${escAttr(it.username)}" ${handleDisabled}><i class="fas fa-ban"></i> 继续封禁</button>
              <button type="button" class="miniBtn" data-action="unban" data-id="${it.id}" data-username="${escAttr(it.username)}" ${handleDisabled}><i class="fas fa-unlock"></i> 解除封禁</button>
              <button type="button" class="miniBtn" data-action="copy-username" data-username="${escAttr(it.username)}"><i class="fas fa-copy"></i> 复制用户名</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function copyUsername(username) {
      const raw = String(username || '');
      if (!raw) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(raw).then(() => alert('已复制用户名')).catch(() => alert('复制失败'));
      }
    }

    async function deleteRecord(id) {
      if (!confirm('确定删除该条记录吗？删除后不可恢复，匿名/未匹配的提交可借此释放空间。')) return;
      const res = await fetch('/api/admin/account_feedbacks/' + id, { method: 'DELETE', credentials: 'same-origin' });
      const data = await res.json();
      if (res.ok) {
        loadData(true);
      } else {
        alert(data.error || '删除失败');
      }
    }

    function openModal(id, username){
      currentId = Number(id);
      document.getElementById('modalUser').textContent = `当前记录ID：${id}，账号：${username}`;
      document.getElementById('adminNote').value = '';
      document.getElementById('banReason').value = '';
      const modal = document.getElementById('actionModal');
      modal.classList.add('show');
      requestAnimationFrame(()=> modal.classList.add('open'));
    }
    function closeModal(){
      const modal = document.getElementById('actionModal');
      modal.classList.remove('open');
      setTimeout(()=> modal.classList.remove('show'), 560);
      currentId = null;
    }

    async function quickUnban(id, username){
      if (!confirm(`确定解除封禁吗？\n账号：${username}`)) return;
      const res = await fetch('/api/admin/account_feedbacks/action', {
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: Number(id), action: 'unban', admin_note: '管理员快速解除封禁' })
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (res.ok){
        alert(data.message || '已解除封禁');
        loadData(true);
      } else {
        alert(data.error || '操作失败');
      }
    }

    async function submitAction(action){
      if (!currentId) return;
      const duration = document.getElementById('banDuration').value;
      const reason = document.getElementById('banReason').value.trim();
      const admin_note = document.getElementById('adminNote').value.trim();
      const payload = { id: currentId, action, duration, reason, admin_note };
      const res = await fetch('/api/admin/account_feedbacks/action', {
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      let data = {};
      try { data = await res.json(); } catch (e) {}
      if (res.ok){
        alert(data.message || '处理成功');
        closeModal();
        loadData(true);
      }else{
        alert(data.error || '处理失败');
      }
    }

    document.getElementById('list').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn || btn.disabled) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      const username = btn.dataset.username || '';
      if (action === 'view-image' && btn.dataset.image) {
        window.open('static/account_feedback/' + btn.dataset.image, '_blank');
      } else if (action === 'open-modal' || action === 'continue-ban') {
        openModal(id, username);
      } else if (action === 'unban') {
        quickUnban(id, username);
      } else if (action === 'delete') {
        deleteRecord(id);
      } else if (action === 'copy-username') {
        copyUsername(username);
      }
    });

    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape') closeModal(); });
    document.getElementById('actionModal').addEventListener('click', (e)=>{ if (e.target.id === 'actionModal') closeModal(); });

    loadData(true);
  </script>
</body>
</html>
