<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>河流污染监测系统</title>
<style>
:root {
  --base-unit: min(1.6vh, 1.2vw);
  --primary-color: #00c6ff;
  --secondary-color: #0072ff;
  --accent-color: #00ffcc;
  --bg-dark: #0a192f;
  --bg-darker: #020c1b;
  --card-bg: rgba(10, 25, 47, 0.8);
  --card-glass: rgba(100, 150, 255, 0.1);
  --text-primary: #e6f1ff;
  --text-secondary: #ccd6f6;
  --card-shadow: 0 8px 32px rgba(0, 114, 255, 0.1);
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  --glow: 0 0 10px rgba(0, 198, 255, 0.7);
}
 
/* 在style标签内添加以下代码 */
dialog {
  color: var(--text-primary) !important;
  opacity: 0;
  transform: scale(0.9);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

dialog[open] {
  opacity: 1;
  transform: scale(1);
}

dialog::backdrop {
  background: rgba(2, 12, 27, 0.8);
  backdrop-filter: blur(5px);
  opacity: 0;
  transition: opacity 0.3s ease;
}

dialog[open]::backdrop {
  opacity: 1;
}

dialog h2 {
  font-size: 1.5em;
  margin-bottom: 1.2em;
  color: var(--accent-color) !important;
  text-shadow: 0 0 8px rgba(0, 255, 204, 0.3);
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s ease 0.1s;
}

dialog[open] h2 {
  opacity: 1;
  transform: translateY(0);
}

dialog p {
  font-size: 1.1em;
  line-height: 1.8;
  color: rgba(255, 255, 255, 0.9) !important;
  margin-bottom: 1.5em;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease 0.2s;
}

dialog[open] p {
  opacity: 1;
  transform: translateY(0);
}

dialog strong {
  color: var(--primary-color) !important;
  font-weight: 500;
}

dialog button {
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.3s ease 0.3s;
}

dialog[open] button {
  opacity: 1;
  transform: translateY(0);
}

.iconfont {
  font-family: "iconfont" !important;
  font-size: calc(var(--base-unit) * 2);
  font-style: normal;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  color: var(--text-primary);
}
 
.icon-camera:before { content: "\e7a6"; }
.icon-info:before { content: "\e7a2"; }
 
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  background: var(--bg-darker);
  height: 100vh;
  position: relative;
  overflow: hidden;
  font-size: calc(var(--base-unit) * 1.2);
  color: var(--text-primary);
  line-height: 1.6;
}
 
.container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  max-width: 2560px;
  margin: 0 auto;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
}
 
.background {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 0;
  overflow: hidden;
}
 
/* 高科技背景效果 */
.tech-bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%),
    linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%);
  filter: blur(20px);
  opacity: 0.8;
  will-change: transform;
  animation: bgPulse 10s ease-in-out infinite;
  z-index: 1;
}

@keyframes bgPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* 网格背景 */
.grid-lines {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity: 0.3;
  animation: gridMove 20s linear infinite;
  will-change: transform;
  z-index: 2;
}

@keyframes gridMove {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}

/* 高科技粒子效果 */
.tech-particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(0, 198, 255, 0.8);
  box-shadow: var(--glow);
  animation: tech-float linear infinite;
  z-index: 3;
}
 
@keyframes tech-float {
  0% {
    transform: translateY(0) translateX(0);
    opacity: 0;
  }
  10% {
    opacity: 1;
  }
  100% {
    transform: translateY(-100vh) translateX(20px);
    opacity: 0;
  }
}

/* 高级科技粒子特效 */
.tech-circle {
    position: absolute;
    border: 1px solid rgba(0, 198, 255, 0.3);
    border-radius: 50%;
    animation: rotate 20s linear infinite;
    z-index: 2;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.data-stream {
    position: absolute;
    color: rgba(0, 198, 255, 0.6);
    font-family: monospace;
    font-size: 12px;
    white-space: nowrap;
    animation: dataFlow 8s linear infinite;
    z-index: 3;
}

@keyframes dataFlow {
    0% {
        transform: translateY(100vh);
        opacity: 0;
    }
    10% {
        opacity: 1;
    }
    90% {
        opacity: 1;
    }
    100% {
        transform: translateY(-100vh);
        opacity: 0;
    }
}

.scan-line {
    position: absolute;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, 
        transparent,
        rgba(0, 198, 255, 0.8),
        transparent
    );
    box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
    animation: scan 4s linear infinite;
    z-index: 4;
}

@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}

.tech-grid {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 198, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 198, 255, 0.1) 1px, transparent 1px);
    background-size: 20px 20px;
    transform: perspective(500px) rotateX(60deg);
    transform-origin: top;
    animation: gridMove 20s linear infinite;
    z-index: 1;
}

@keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(20px); }
}

.energy-pulse {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center,
        rgba(0, 198, 255, 0.1) 0%,
        transparent 70%
    );
    animation: pulse 4s ease-in-out infinite;
    z-index: 2;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.2); opacity: 0.8; }
}

.tech-node {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--primary-color);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--primary-color);
    animation: nodePulse 2s ease-in-out infinite;
    z-index: 3;
}

@keyframes nodePulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.5); opacity: 1; }
}

.water-quality-indicator {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg,
        rgba(0, 255, 136, 0.1) 0%,
        rgba(255, 187, 0, 0.1) 50%,
        rgba(255, 68, 68, 0.1) 100%
    );
    opacity: 0.3;
    z-index: 1;
}

/* 优化现有特效 */
.water-ripple {
    background: radial-gradient(circle, 
        rgba(0, 198, 255, 0.3) 0%, 
        rgba(0, 114, 255, 0.2) 50%,
        transparent 70%
    );
    box-shadow: 0 0 20px rgba(0, 198, 255, 0.2);
}

.flowing-particle {
    background: linear-gradient(90deg,
        transparent,
        rgba(0, 198, 255, 0.8),
        transparent
    );
    box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
}

.pollution-particle {
    background: linear-gradient(45deg,
        rgba(255, 68, 68, 0.6),
        rgba(255, 187, 0, 0.6)
    );
    box-shadow: 0 0 12px rgba(255, 68, 68, 0.4);
}

.water-surface {
    background: linear-gradient(180deg,
        rgba(0, 198, 255, 0.15) 0%,
        rgba(0, 114, 255, 0.1) 50%,
        rgba(0, 198, 255, 0.15) 100%
    );
    backdrop-filter: blur(5px);
}

/* 连接线效果 */
.connection-line {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0, 198, 255, 0.5), transparent);
  transform-origin: left center;
  animation: pulse 2s infinite alternate;
  z-index: 2;
}
 
@keyframes pulse {
  0% { opacity: 0.2; }
  100% { opacity: 0.8; }
}
 
.header {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2vh 5vw 1vh;
  z-index: 10;
  position: relative;
  flex-shrink: 0;
}
 
.logo {
  width: 12vh;
  height: 12vh;
  min-width: 80px;
  min-height: 80px;
  border-radius: 50%;
  margin-bottom: 3vh;
  box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
  border: 2px solid rgba(0, 198, 255, 0.5);
  background-color: rgba(10, 25, 47, 0.7);
  object-fit: cover;
  padding: 8px;
  transition: var(--transition);
  backdrop-filter: blur(5px);
}
 
.logo:hover {
  transform: scale(1.05) rotate(5deg);
  box-shadow: 0 0 30px rgba(0, 198, 255, 0.8);
}
 
.title-box {
  text-align: center;
  max-width: 800px;
  margin: 0 auto;
}
 
.title {
  font-size: clamp(24px, calc(var(--base-unit) * 3), 48px);
  font-weight: 700;
  background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 1vh;
  text-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
  display: inline-block;
  will-change: transform, opacity;
  animation: titleFadeIn 1s ease-out;
}

@keyframes titleFadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
 
.floating-text {
  display: inline-block;
  animation: floating 3s ease-in-out infinite;
}
 
@keyframes floating {
  0% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}
 
.subtitle {
  font-size: clamp(16px, calc(var(--base-unit) * 1.5), 24px);
  color: var(--text-secondary);
  text-align: center;
  margin-top: 1vh;
  font-weight: 400;
  text-shadow: 0 0 5px rgba(0, 198, 255, 0.3);
}
 
.hero-actions {
  position: relative;
  padding: 0 6vw 2vh;
  width: 100%;
  box-sizing: border-box;
  z-index: 10;
  margin: 4vh auto 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
 
.card {
  background: linear-gradient(135deg, var(--card-glass), rgba(0, 114, 255, 0.2));
  border-radius: 16px;
  box-shadow: var(--card-shadow);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  will-change: transform;
  border: 1px solid rgba(0, 198, 255, 0.2);
  backdrop-filter: blur(5px);
  transform: translateZ(0);
}

.camera-primary {
  width: min(60vw, 540px);
  min-width: 300px;
  min-height: 200px;
  border-width: 1.5px;
}

.camera-primary .card-content {
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  text-align: center;
}

.camera-primary .card-title {
  font-size: clamp(20px, calc(var(--base-unit) * 2.3), 30px);
  margin: 0;
}

.camera-primary .card-desc {
  font-size: clamp(14px, calc(var(--base-unit) * 1.4), 18px);
  margin: 0;
}
 
.card::before {
  content: '';
  position: absolute;
  top: -2px;
  left: -2px;
  right: -2px;
  bottom: -2px;
  background: linear-gradient(45deg, var(--primary-color), var(--accent-color), var(--primary-color));
  z-index: -1;
  border-radius: 18px;
  opacity: 0;
  transition: opacity 0.3s ease;
}
 
.card:hover::before {
  opacity: 0.4;
}
 
.card:hover {
  transform: translateY(-8px) scale(1.02) translateZ(0);
  box-shadow: 0 15px 35px rgba(0, 114, 255, 0.3);
}
 
.card:active {
  transform: scale(0.98);
}
 
.card-content {
  display: flex;
  padding: 32px;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 2;
  height: 100%;
  box-sizing: border-box;
}
 
.card-text {
  flex: 1;
  margin-right: 16px;
}
 
.card-icon {
  width: calc(var(--base-unit) * 5);
  height: calc(var(--base-unit) * 5);
  min-width: 48px;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: rgba(0, 198, 255, 0.2);
  border-radius: 50%;
  transition: var(--transition);
  border: 1px solid rgba(0, 198, 255, 0.3);
}
 
.card:hover .card-icon {
  transform: rotate(15deg) scale(1.1);
  background-color: rgba(0, 198, 255, 0.4);
  box-shadow: var(--glow);
}
 
.card-title {
  font-size: clamp(18px, calc(var(--base-unit) * 2), 28px);
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
 
.card-desc {
  font-size: clamp(14px, calc(var(--base-unit) * 1.2), 18px);
  color: var(--text-secondary);
  line-height: 1.5;
}
 
.ripple-effect {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 198, 255, 0.4) 0%, rgba(0, 198, 255, 0) 70%);
  transform: scale(0);
  opacity: 0;
  pointer-events: none;
  animation: ripple 0.6s linear;
}
 
@keyframes ripple {
  to {
    transform: scale(4);
    opacity: 0;
  }
}
 
.quick-facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  padding: 20px 8vw;
  z-index: 10;
  position: relative;
  max-width: 1200px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
 
.fact {
  display: flex;
  flex-direction: column;
  align-items: center;
  background-color: var(--card-bg);
  padding: 24px 16px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0, 114, 255, 0.1);
  transition: var(--transition);
  backdrop-filter: blur(5px);
  border: 1px solid rgba(0, 198, 255, 0.2);
}
 
.fact:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 16px rgba(0, 114, 255, 0.2);
}
 
.fact-number {
  font-size: clamp(24px, calc(var(--base-unit) * 2.5), 36px);
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 8px;
  background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: 0 0 8px rgba(0, 198, 255, 0.5);
}
 
.fact-text {
  font-size: clamp(14px, calc(var(--base-unit) * 1.2), 18px);
  color: var(--text-secondary);
  text-align: center;
  font-weight: 500;
}
 
.footer {
  padding: 8px 0;
  text-align: center;
  margin-top: auto;
  z-index: 10;
  position: relative;
  background-color: rgba(10, 25, 47, 0.8);
  backdrop-filter: blur(5px);
  border-top: 1px solid rgba(0, 198, 255, 0.2);
  flex-shrink: 0;
}
 
.footer-text {
  font-size: clamp(14px, calc(var(--base-unit) * 1.2), 18px);
  color: var(--text-secondary);
}
 
.user-info {
  position: fixed;
  top: 24px;
  right: 36px;
  z-index: 999;
  background: rgba(10,25,47,0.85);
  color: #00c6ff;
  border-radius: 20px;
  padding: 6px 18px 6px 10px;
  font-size: 0.95em;
  font-weight: 600;
  box-shadow: 0 4px 16px rgba(0,198,255,0.12);
  cursor: pointer;
  user-select: none;
  transition: box-shadow 0.3s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-info:hover {
  box-shadow: 0 8px 32px rgba(0,198,255,0.18);
}

#userAvatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 2.5px solid #00c6ff;
  box-shadow: 0 0 0 4px rgba(0,198,255,0.12), 0 2px 8px rgba(0,198,255,0.12);
  background: #fff;
  transition: box-shadow 0.3s, border 0.3s;
}

.user-info.active #userAvatar, .user-info:hover #userAvatar {
  box-shadow: 0 0 0 6px #00c6ff44, 0 8px 32px rgba(0,198,255,0.18);
  border: 2.5px solid #00ffcc;
}

.dropdown-arrow {
  display: inline-block;
  margin-left: 6px;
  font-size: 1.1em;
  transition: transform 0.3s;
}

.user-info.active .dropdown-arrow {
  transform: rotate(180deg);
}

.user-info .dropdown {
  display: none;
  position: absolute;
  top: 56px;
  right: 0;
  min-width: 180px;
  background: rgba(10,25,47,0.98);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,198,255,0.18);
  border: 1.5px solid rgba(0,198,255,0.10);
  padding: 10px 0 10px 0;
  animation: dropdownFade 0.25s;
  transition: box-shadow 0.3s;
  z-index: 1001;
}

.user-info.active .dropdown {
  display: block;
}

@keyframes dropdownFade {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

#dropdownUsername {
  color: #00c6ff;
  font-weight: 700;
  font-size: 0.98em;
  letter-spacing: 1px;
  display: block;
  text-align: center;
  margin: 6px 0 4px;
}

.dropdown-btn {
  width: 100%;
  background: none;
  border: none;
  color: #00c6ff;
  font-size: 1.02em;
  padding: 12px 20px;
  cursor: pointer;
  border-radius: 8px;
  transition: background 0.18s, color 0.18s, font-weight 0.18s;
  text-align: left;
  font-weight: 500;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
  margin-top: 2px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.dropdown-btn-icon {
  display: inline-block;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
  font-size: 1.1em;
}

.dropdown-btn:hover {
  background: rgba(0,198,255,0.10);
  color: #00ffcc;
  font-weight: 700;
}

.dropdown-btn.logout {
  color: #ff4444;
}

.dropdown-btn.logout:hover {
  background: rgba(255,68,68,0.08);
  color: #fff;
}

.change-pwd-form {

<script>
// 创建高科技粒子背景 
function createTechParticles() {
  const particlesContainer = document.getElementById('particles'); 
  const particleCount = Math.floor(window.innerWidth  / 5);
  
  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div'); 
    particle.classList.add('tech-particle'); 
    
    // 随机大小 (1px - 4px)
    const size = Math.random()  * 3 + 1;
    particle.style.width  = `${size}px`;
    particle.style.height  = `${size}px`;
    
    // 随机位置
    particle.style.left  = `${Math.random()  * 100}%`;
    particle.style.top  = `${Math.random()  * 100 + 100}%`;
    
    // 随机动画延迟和持续时间 
    const delay = Math.random()  * 10;
    const duration = Math.random()  * 20 + 10;
    particle.style.animationDelay  = `${delay}s`;
    particle.style.animationDuration  = `${duration}s`;
    
    // 随机透明度
    particle.style.opacity  = Math.random()  * 0.5 + 0.5;
    
    particlesContainer.appendChild(particle); 
  }
}
 
// 创建连接线效果 
function createConnections() {
  const connectionsContainer = document.getElementById('connections'); 
  const connectionCount = Math.floor(window.innerWidth  / 50);
  
  for (let i = 0; i < connectionCount; i++) {
    const line = document.createElement('div'); 
    line.classList.add('connection-line'); 
    
    // 随机位置和长度 
    const top = Math.random()  * 100;
    const left = Math.random()  * 100;
    const length = Math.random()  * 200 + 50;
    const angle = Math.random()  * 360;
    
    line.style.top  = `${top}%`;
    line.style.left  = `${left}%`;
    line.style.width  = `${length}px`;
    line.style.transform  = `rotate(${angle}deg)`;
    
    // 随机动画延迟
    line.style.animationDelay  = `${Math.random()  * 2}s`;
    
    connectionsContainer.appendChild(line); 
  }
}
 
// 波纹效果 
function createRipple(event) {
  const card = event.currentTarget; 
  const rect = card.getBoundingClientRect(); 
  
  const ripple = document.createElement('span'); 
  ripple.classList.add('ripple-effect'); 
  
  // 设置波纹位置
  const x = event.clientX  - rect.left; 
  const y = event.clientY  - rect.top; 
  ripple.style.left  = `${x}px`;
  ripple.style.top  = `${y}px`;
  
  card.appendChild(ripple); 
  
  // 动画结束后移除元素

// 密码验证函数（与注册页面相同）
function validatePassword(password) {
  if (password.length < 6) {
    return '密码长度不能少于6位';
  }
  if (!/[a-zA-Z]/.test(password)) {
    return '密码必须包含至少一个字母';
  }
  if (!/\d/.test(password)) {
    return '密码必须包含至少一个数字';
  }
  if (/^(.)\1+$/.test(password)) {
    return '密码不能太简单，不能全是相同字符';
  }
  if (/012|123|234|345|456|567|678|789|987|876|765|654|543|432|321|210/.test(password)) {
    return '密码不能包含连续数字';
  }
  return '';
}

const changePwdForm = document.getElementById('changePwdForm');
if (changePwdForm) {
  changePwdForm.onsubmit = async (e) => {
    e.preventDefault();
    const oldPassword = document.getElementById('oldPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msg = document.getElementById('pwdMsg');
    msg.className = 'change-pwd-msg';
    
    if (newPassword !== confirmPassword) {
      msg.textContent = '两次新密码不一致';
      msg.classList.add('error');
      return;
    }
    
    // 验证新密码
    const passwordError = validatePassword(newPassword);
    if (passwordError) {
      msg.textContent = passwordError;
      msg.classList.add('error');
      return;
    }
    
    const res = await fetch('/api/change_password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ old_password: oldPassword, new_password: newPassword })
    });
    const data = await res.json();
    if (res.ok) {
      msg.textContent = '修改成功，正在跳转...';
      msg.classList.add('success');
      setTimeout(() => { window.location.href = 'login.html'; }, 1000);
    } else {
      msg.textContent = data.error || '修改失败';
    }
  };
}

// 注销账号三步骤确认动画
let deleteConfirmStep = 0;
let deletePopup = null;
let deletePopupContent = null;

function createDeletePopup(x, y) {
  if (deletePopup) {
    deletePopup.remove();
  }
  deleteConfirmStep = 0;

    min-width: 320px;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(255,68,68,0.3);
    backdrop-filter: blur(10px);
    z-index: 10000;
    transition: all 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);

    </div>
  `;
  deletePopup.appendChild(deletePopupContent);
  document.body.appendChild(deletePopup);
  
  // 移动到中间（缓慢流畅的动画，2.5秒）
  requestAnimationFrame(() => {

function moveDeletePopupToCorner(position) {
  if (!deletePopup) return;
  
  // 调整位置，不要太靠边（左上：距离左边和顶部各200px，右上：距离右边200px，顶部200px）
  const targetX = position === 'left' ? 200 : window.innerWidth - 200;
  const targetY = 200;
  
  // 缓慢流畅的动画（2.5秒，先加速再减速）
  deletePopup.style.transition = 'all 2.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
  deletePopup.style.left = `${targetX}px`;
  deletePopup.style.top = `${targetY}px`;
  deletePopup.style.transform = 'translate(-50%, -50%)';
  
  setTimeout(() => {
    if (deleteConfirmStep === 1) {
      deletePopupContent.innerHTML = `
        <h3 style="color:#ff4444;margin:0 0 16px 0;font-size:1.3em;text-align:center;">⚠️ 数据不可恢复，确认吗</h3>
        <div style="display:flex;gap:12px;justify-content:center;">

        </div>
      `;
      document.getElementById('deleteCancelBtn2').onclick = () => {
        deletePopup.remove();
        deletePopup = null;
        deleteConfirmStep = 0;
      };
      document.getElementById('deleteConfirmBtn2').onclick = () => {
        deleteConfirmStep = 2;
        moveDeletePopupToCorner('right');
      };
    } else if (deleteConfirmStep === 2) {
      deletePopupContent.innerHTML = `
        <h3 style="color:#ff4444;margin:0 0 16px 0;font-size:1.3em;text-align:center;">⚠️ 数据不可恢复，确认吗</h3>
        <div style="display:flex;gap:12px;justify-content:center;">
          <button id="deleteCancelBtn3" style="background:rgba(0,198,255,0.1);border:1px solid rgba(0,198,255,0.3);color:#00c6ff;padding:10px 20px;border-radius:8px;cursor:pointer;">取消</button>

        </div>
      `;
      document.getElementById('deleteCancelBtn3').onclick = () => {
        deletePopup.remove();

      <div style="text-align:center;color:var(--text-secondary);">正在注销账号...</div>
    `;
    
    setTimeout(() => {

      fetch('/api/delete_account', { method: 'POST' })
        .then(res => res.json().then(d => ({ ok: res.ok, data: d })))

          } else {

              deletePopup.remove();

        .catch(() => {
          alert('网络异常，请稍后重试');
          if (deletePopup) {
            deletePopup.remove();
    }
          deletePopup = null;

}

// 首页进入时：若被警告过则弹窗活跃度提示
window.addEventListener('DOMContentLoaded', () => {
  (async function checkInactivityWarning() {
    try {
      const res = await fetch('/api/user/status', { credentials: 'same-origin' });
      if (!res.ok) return;
      const data = await res.json();
      if (!data.show_inactivity_warning) return;
      const d = document.getElementById('inactivityWarningDialog');
      if (d) d.showModal();
    } catch (e) {}
  })();
});

// 弹窗按钮 hover 动效更丝滑 + 关闭动画更慢更丝滑
window.addEventListener('DOMContentLoaded', () => {
  const d = document.getElementById('inactivityWarningDialog');
  const btn = document.querySelector('#inactivityWarningDialog button[data-role=\"close\"]');
  if (!d || !btn) return;

  btn.addEventListener('mouseenter', () => {
    btn.style.transform = 'translateY(-1px)';
    btn.style.boxShadow = '0 14px 30px rgba(0,198,255,0.24)';
  });
  btn.addEventListener('mouseleave', () => {
    btn.style.transform = 'translateY(0)';
    btn.style.boxShadow = '0 10px 24px rgba(0,198,255,0.18)';
  });

  const smoothClose = () => {
    if (!d.open) return;
    d.setAttribute('data-closing', '1');
    // 缓慢一点的关闭动画
    setTimeout(() => {
      try { d.close(); } catch (e) {}
      d.removeAttribute('data-closing');
    }, 650);
  };
  btn.addEventListener('click', smoothClose);
  d.addEventListener('cancel', (e) => {
    // ESC 也走丝滑关闭
    e.preventDefault();
    smoothClose();
  });
});
</script>

<!-- 活跃度提示弹窗（被警告用户进入首页时显示） -->

    <p style="line-height:1.8; margin:0 0 0 0; color: rgba(255,255,255,0.88);">请及时保持活跃。</p>

    <div style="margin:0; display:flex; justify-content:center; width:100%;">
      <button type="button" data-role="close" style="padding: 10px 28px; background: linear-gradient(45deg, var(--primary-color), var(--accent-color)); border: none; border-radius: 12px; color: #fff; cursor: pointer; font-size: 1em; box-shadow: 0 10px 24px rgba(0,198,255,0.18); transition: transform 0.18s ease, box-shadow 0.18s ease;">我知道了</button>
    </div>
  </div>
</dialog>
<script>
  // 关闭时的渐隐（保持 open 状态一段时间再 close）
  (function() {
    const d = document.getElementById('inactivityWarningDialog');
    if (!d) return;
    const apply = () => {
      if (d.getAttribute('data-closing') === '1') {
        d.style.opacity = '0';
        d.style.transform = 'translateY(6px) scale(0.98)';
      } else {
        d.style.opacity = '';
        d.style.transform = '';
      }
    };
    const mo = new MutationObserver(apply);
    mo.observe(d, { attributes: true, attributeFilter: ['data-closing', 'open'] });
  })();
</script>
