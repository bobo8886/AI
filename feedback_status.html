<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的反馈处理进度 - 河流污染监测系统</title>
    <style>
        :root { --primary-color:#00c6ff; --secondary-color:#0072ff; --accent-color:#00ffcc; --bg-dark:#0a192f; --bg-darker:#020c1b; --card-bg:rgba(10,25,47,0.8); --text-primary:#e6f1ff; --text-secondary:#ccd6f6; }
        body { margin:0; padding:0; font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; background:var(--bg-darker); color:var(--text-primary); min-height:100vh; }
        .background { position:fixed; width:100%; height:100%; top:0; left:0; z-index:0; overflow:hidden; }
        .tech-bg { position:absolute; width:100%; height:100%; background: radial-gradient(circle at 20% 30%, rgba(0,198,255,.15) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0,114,255,.15) 0%, transparent 40%), linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%); filter:blur(20px); opacity:.8; z-index:1; animation:bgPulse 10s ease-in-out infinite; }
        .grid-lines { position:absolute; width:100%; height:100%; background-image: linear-gradient(rgba(0,198,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0,198,255,0.05) 1px, transparent 1px); background-size:40px 40px; z-index:2; opacity:.3; animation:gridMove 20s linear infinite; }
        @keyframes bgPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        @keyframes gridMove { 0%{transform:translateY(0)} 100%{transform:translateY(40px)} }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; position: relative; z-index:3; }
        .header { text-align:center; margin-bottom:2rem; position:relative; }
        .back-btn { position:absolute; left:0; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-primary); cursor:pointer; font-size:1.1rem; }
        .back-btn:hover{ color:var(--primary-color); }
        .title { color:var(--primary-color); font-size:2.2rem; margin-bottom:.5rem; text-shadow:0 0 10px rgba(0,198,255,0.3); }
        .panel { background: linear-gradient(135deg, var(--card-bg), rgba(0, 114, 255, 0.2)); border-radius:16px; padding:1rem; box-shadow: 0 8px 32px rgba(0,114,255,0.1); border:1px solid rgba(0,198,255,0.2); backdrop-filter: blur(10px); }
        table { width:100%; border-collapse:collapse; }
        th, td { padding:12px; border-bottom:1px solid rgba(0,198,255,0.12); text-align:left; color:var(--text-secondary); }
        thead th { color:var(--text-primary); background: rgba(0,198,255,0.1); }
        .badge { display:inline-block; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:500; transition:all 0.3s; }
        .mild { background: rgba(0,255,136,0.15); color:#00ff88; border:1px solid rgba(0,255,136,0.3); }
        .medium { background: rgba(255,187,0,0.15); color:#ffbb00; border:1px solid rgba(255,187,0,0.3); }
        .severe { background: rgba(255,68,68,0.15); color:#ff4444; border:1px solid rgba(255,68,68,0.3); }
        .vsevere { background: rgba(255,0,0,0.15); color:#ff0000; border:1px solid rgba(255,0,0,0.3); }
        .none { background: rgba(0,255,204,0.15); color:#00ffcc; border:1px solid rgba(0,255,204,0.3); }
        .status { padding:6px 12px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,198,255,0.1); color:var(--text-primary); font-weight:500; transition:all 0.3s; }
        tbody tr { transition:background 0.2s; }
        tbody tr:hover { background:rgba(0,198,255,0.05); }
        .back-btn { padding:8px 16px; border-radius:8px; transition:all 0.3s; background:rgba(0,198,255,0.1); border:1px solid rgba(0,198,255,0.2); }
        .back-btn:hover { background:rgba(0,198,255,0.2); color:var(--primary-color); transform:translateX(-3px); }
    </style>

<script src="static/mock-api.js"></script>
</head>
<body>
    <div class="background">
        <div class="tech-bg"></div>
        <div class="grid-lines"></div>
    </div>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='Untitled-1.html'">← 返回首页</button>
            <h1 class="title">我的反馈处理进度</h1>
        </div>
        <div class="panel">
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>地点</th>
                        <th>污染等级</th>
                        <th>内容</th>
                        <th>状态</th>
                        <th>管理员备注</th>
                        <th>更新时间</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
    <script>
        function lvClass(lv){ 
            if(lv==='无污染') return 'none';
            if(lv==='轻微') return 'mild';
            if(lv==='中等') return 'medium';
            if(lv==='严重') return 'severe';
            if(lv==='非常严重') return 'vsevere';
            return 'mild';
        }
        async function load(){
            const res = await fetch('/api/my_feedbacks');
            if(!res.ok) return;
            const list = await res.json();
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = list.map(it=>`
                <tr>
                    <td>${new Date(it.created_at).toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    })}</td>
                    <td>${it.location}</td>
                    <td><span class="badge ${lvClass(it.pollution_level)}">${it.pollution_level}</span></td>
                    <td style="white-space:pre-wrap">${it.content}</td>
                    <td><span class="status">${it.status||'待核实'}</span></td>
                    <td style="white-space:pre-wrap">${(it.admin_note||'')}</td>
                    <td>${it.updated_at ? new Date(it.updated_at).toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    }) : '-'}</td>
                </tr>
            `).join('');
        }
        load();
    </script>
    <link rel="stylesheet" href="static/target-cursor.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="static/target-cursor.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        initTargetCursor({ targetSelector: 'a, button, .cursor-target', spinDuration: 2, hideDefaultCursor: true });
      });
    </script>
</body>
</html>
