<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据实验室 - 河流污染监测系统</title>
    <style>
        :root {
            --primary-color: #00c6ff;
            --secondary-color: #0072ff;
            --accent-color: #00ffcc;
            --bg-dark: #0a192f;
            --bg-darker: #020c1b;
            --card-bg: rgba(10, 25, 47, 0.8);
            --text-primary: #e6f1ff;
            --text-secondary: #ccd6f6;
        }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; background: var(--bg-darker); color: var(--text-primary); min-height: 100vh; }
        .background { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; overflow: hidden; }
        .tech-bg { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%), radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%), linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%); filter: blur(20px); opacity: 0.8; z-index: 1; will-change: transform; animation: bgPulse 10s ease-in-out infinite; }
        .grid-lines { position: absolute; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px); background-size: 40px 40px; z-index: 2; opacity: 0.3; animation: gridMove 20s linear infinite; will-change: transform; }
        .particle-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
        .floating-particle { position: absolute; bottom: -60px; width: 7px; height: 7px; border-radius: 50%; background: rgba(0, 198, 255, 0.45); box-shadow: 0 0 12px rgba(0, 198, 255, 0.25); opacity: 0; animation: dataBubbleFloat linear infinite; }
        @keyframes dataBubbleFloat { 0% { transform: translate3d(0, 0, 0) scale(0.6); opacity: 0; } 10% { opacity: 0.8; } 80% { opacity: 0.4; } 100% { transform: translate3d(35px, -120vh, 0) scale(1.2); opacity: 0; } }
        @keyframes bgPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes gridMove { 0% { transform: translateY(0); } 100% { transform: translateY(40px); } }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 3; }
        .header { text-align: center; margin-bottom: 2rem; position: relative; }
        .back-btn { position: absolute; left: 0; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-primary); cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; transition: all 0.3s ease; }
        .back-btn:hover { color: var(--primary-color); }
        .title { color: var(--primary-color); font-size: 2.2rem; margin-bottom: 0.5rem; text-shadow: 0 0 10px rgba(0, 198, 255, 0.3); }
        .subtitle { color: var(--text-secondary); }

        .panel { background: linear-gradient(135deg, var(--card-bg), rgba(0, 114, 255, 0.2)); border-radius: 16px; padding: 1.2rem; box-shadow: 0 8px 32px rgba(0, 114, 255, 0.1); border: 1px solid rgba(0, 198, 255, 0.2); backdrop-filter: blur(10px); margin-bottom: 1rem; }
        .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; align-items: end; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        label { color: var(--text-secondary); font-size: 0.95rem; }
        input, select { background: rgba(255,255,255,0.06); color: var(--text-primary); border: 1px solid rgba(0, 198, 255, 0.2); border-radius: 10px; padding: 10px 12px; outline: none; }
        .actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { background: rgba(0, 198, 255, 0.12); color: var(--text-primary); border: 1px solid rgba(0, 198, 255, 0.3); padding: 10px 14px; border-radius: 10px; cursor: pointer; transition: .2s; }
        .btn:hover { background: rgba(0, 198, 255, 0.2); transform: translateY(-1px); }
        .btn.danger { background: rgba(255,68,68,0.1); border-color: rgba(255,68,68,0.3); color: #ff6666; }
        .btn.danger:hover { background: rgba(255,68,68,0.2); }
        .table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid rgba(0, 198, 255, 0.15); text-align: left; color: var(--text-secondary); }
        thead th { color: var(--text-primary); background: rgba(0, 198, 255, 0.1); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .mild { background: rgba(0,255,136,0.1); color: #00ff88; border: 1px solid rgba(0,255,136,0.2); }
        .medium { background: rgba(255,187,0,0.1); color: #ffbb00; border: 1px solid rgba(255,187,0,0.2); }
        .severe { background: rgba(255,68,68,0.1); color: #ff4444; border: 1px solid rgba(255,68,68,0.2); }
        .vsevere { background: rgba(255,0,0,0.1); color: #ff0000; border: 1px solid rgba(255,0,0,0.2); }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 10px; flex-wrap: wrap; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .stat-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(0, 198, 255, 0.2); border-radius: 14px; padding: 12px; }
    </style>

<script src="static/mock-api.js"></script>
</head>
<body>
    <div class="background">
        <div class="tech-bg"></div>
        <div class="grid-lines"></div>
        <div class="particle-layer" id="bgParticles"></div>
    </div>

    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='admin.html'">← 返回管理面板</button>
            <h1 class="title">数据实验室</h1>
            <div class="subtitle">对用户反馈进行筛选、导出、批量删除和统计</div>
        </div>

        <div class="panel">
            <div class="filters">
                <div class="field">
                    <label>用户名</label>
                    <input type="text" id="f_username" placeholder="模糊匹配">
                </div>
                <div class="field">
                    <label>地点</label>
                    <input type="text" id="f_location" placeholder="模糊匹配">
                </div>
                <div class="field">
                    <label>污染等级</label>
                    <select id="f_levels" multiple>
                        <option value="轻微">轻微</option>
                        <option value="中等">中等</option>
                        <option value="严重">严重</option>
                        <option value="非常严重">非常严重</option>
                    </select>
                </div>
                <div class="field">
                    <label>关键词</label>
                    <input type="text" id="f_keyword" placeholder="内容关键词">
                </div>
                <div class="field">
                    <label>开始时间</label>
                    <input type="datetime-local" id="f_start">
                </div>
                <div class="field">
                    <label>结束时间</label>
                    <input type="datetime-local" id="f_end">
                </div>
            </div>
            <div class="actions" style="margin-top:10px">
                <button class="btn" id="btnSearch">查询</button>
                <button class="btn" id="btnExport">导出CSV</button>
                <button class="btn danger" id="btnDelete">批量删除</button>
                <select id="bulkStatus" style="background:rgba(255,255,255,0.06); color:#e6f1ff; border:1px solid rgba(0,198,255,0.2); border-radius:8px; padding:8px 10px;">
                    <option value="">批量设置状态...</option>
                    <option value="待核实">待核实</option>
                    <option value="已解决">已解决</option>
                    <option value="未解决">未解决</option>
                </select>
                <input id="bulkNote" placeholder="批量备注（可选）" style="background:rgba(255,255,255,0.06); color:#e6f1ff; border:1px solid rgba(0,198,255,0.2); border-radius:8px; padding:8px 10px; min-width:220px;">
                <button class="btn" id="btnBulkUpdate">批量更新状态</button>
            </div>
        </div>

        <div class="panel">
            <div class="toolbar">
                <div>共 <span id="total">0</span> 条</div>
                <div>
                    <label style="margin-right:6px">排序:</label>
                    <select id="sortBy">
                        <option value="created_at">时间</option>
                        <option value="location">地点</option>
                        <option value="pollution_level">污染等级</option>
                    </select>
                    <select id="sortOrder">
                        <option value="desc">降序</option>
                        <option value="asc">升序</option>
                    </select>
                </div>
            </div>
            <table class="table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="checkAll"></th>
                        <th>ID</th>
                        <th>用户名</th>
                        <th>地点</th>
                        <th>污染等级</th>
                        <th>状态</th>
                        <th>内容</th>
                        <th>时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div class="actions" style="justify-content: flex-end; margin-top:10px">
                <button class="btn" id="prev">上一页</button>
                <span id="pageInfo" style="align-self:center;color:var(--text-secondary)">第 1 页</span>
                <button class="btn" id="next">下一页</button>
            </div>
        </div>

        <div class="panel">
            <div class="toolbar"><div style="font-weight:600;color:var(--primary-color)">统计</div></div>
            <div class="stats" id="stats"></div>
        </div>
    </div>

    <script>
        const state = { limit: 20, offset: 0, total: 0 };

        function initBackgroundParticles() {
            const layer = document.getElementById('bgParticles');
            if (!layer) return;
            layer.innerHTML = '';
            const count = Math.min(130, Math.floor(window.innerWidth / 16));
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('span');
                particle.className = 'floating-particle';
                const size = Math.random() * 6 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 9 + 8}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                layer.appendChild(particle);
            }
        }

        function getFilters() {
            const levels = Array.from(document.getElementById('f_levels').selectedOptions).map(o => o.value);
            return {
                username: document.getElementById('f_username').value.trim(),
                location: document.getElementById('f_location').value.trim(),
                levels: levels,
                keyword: document.getElementById('f_keyword').value.trim(),
                start_date: document.getElementById('f_start').value ? new Date(document.getElementById('f_start').value).toISOString() : '',
                end_date: document.getElementById('f_end').value ? new Date(document.getElementById('f_end').value).toISOString() : '',
                sortBy: document.getElementById('sortBy').value,
                sortOrder: document.getElementById('sortOrder').value,
                limit: state.limit,
                offset: state.offset
            };
        }

        function levelClass(lv){
            return lv === '轻微' ? 'mild' : lv === '中等' ? 'medium' : lv === '严重' ? 'severe' : 'vsevere';
        }

        async function query(){
            const res = await fetch('/api/admin/feedbacks/query', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(getFilters()) });
            if(!res.ok){ console.error('查询失败'); return; }
            const data = await res.json();
            state.total = data.total;
            document.getElementById('total').textContent = data.total;
            document.getElementById('pageInfo').textContent = `第 ${Math.floor(state.offset/state.limit)+1} 页`;
            const tbody = document.getElementById('tbody');
            tbody.innerHTML = data.items.map(it => `
                <tr>
                    <td><input type="checkbox" class="row-check" value="${it.id}"></td>
                    <td>${it.id}</td>
                    <td>${it.username}</td>
                    <td>${it.location}</td>
                    <td><span class="badge ${levelClass(it.pollution_level)}">${it.pollution_level}</span></td>
                    <td>${it.status||'待核实'}</td>
                    <td style="white-space:pre-wrap">${it.content}</td>
                    <td>${new Date(it.created_at).toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    })}</td>
                    <td><button class="btn danger" onclick="deleteSingle(${it.id})" style="padding:6px 12px;font-size:0.9em;">删除</button></td>
                </tr>
            `).join('');
            document.getElementById('checkAll').checked = false;
        }

        async function refreshStats(){
            const payload = getFilters();
            payload.limit = undefined; payload.offset = undefined;
            const res = await fetch('/api/admin/feedbacks/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if(!res.ok){ return; }
            const s = await res.json();
            const stats = document.getElementById('stats');
            const level = s.level_counts || {};
            const topLoc = (s.top_locations||[]).map(x=>`${x.location}(${x.count})`).join('、') || '—';
            const topUsers = (s.top_users||[]).map(x=>`${x.username}(${x.count})`).join('、') || '—';
            stats.innerHTML = `
                <div class="stat-card">总数：<b>${s.total||0}</b></div>
                <div class="stat-card">轻微：${level['轻微']||0}</div>
                <div class="stat-card">中等：${level['中等']||0}</div>
                <div class="stat-card">严重：${level['严重']||0}</div>
                <div class="stat-card">非常严重：${level['非常严重']||0}</div>
                <div class="stat-card">Top地点：${topLoc}</div>
                <div class="stat-card">活跃用户：${topUsers}</div>
            `;
        }

        document.getElementById('btnSearch').onclick = async ()=>{ state.offset = 0; await query(); await refreshStats(); };
        document.getElementById('prev').onclick = async ()=>{ state.offset = Math.max(0, state.offset - state.limit); await query(); };
        document.getElementById('next').onclick = async ()=>{ if(state.offset + state.limit < state.total){ state.offset += state.limit; await query(); } };
        document.getElementById('sortBy').onchange = ()=> document.getElementById('btnSearch').click();
        document.getElementById('sortOrder').onchange = ()=> document.getElementById('btnSearch').click();
        document.getElementById('checkAll').onchange = (e)=>{ document.querySelectorAll('.row-check').forEach(c=> c.checked = e.target.checked ); };

        document.getElementById('btnExport').onclick = async ()=>{
            const res = await fetch('/api/admin/feedbacks/export', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(getFilters()) });
            const text = await res.text();
            const blob = new Blob([text], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'feedbacks_export.csv'; a.click(); URL.revokeObjectURL(url);
        };

        document.getElementById('btnDelete').onclick = async ()=>{
            const ids = Array.from(document.querySelectorAll('.row-check:checked')).map(c=> Number(c.value));
            if(ids.length === 0){ alert('请先勾选记录'); return; }
            if(!confirm(`确定删除选中的 ${ids.length} 条记录？`)) return;
            const res = await fetch('/api/admin/feedbacks/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) });
            if(res.ok){ await query(); await refreshStats(); }
        };

        document.getElementById('btnBulkUpdate').onclick = async ()=>{
            const ids = Array.from(document.querySelectorAll('.row-check:checked')).map(c=> Number(c.value));
            const status = document.getElementById('bulkStatus').value;
            const admin_note = document.getElementById('bulkNote').value;
            if(ids.length === 0){ alert('请先勾选记录'); return; }
            if(!status){ alert('请选择要设置的状态'); return; }
            const res = await fetch('/api/admin/feedbacks/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids, status, admin_note }) });
            if(res.ok){ await query(); await refreshStats(); }
        };

        // 单独删除功能
        async function deleteSingle(id) {
            if(!confirm(`确定删除ID为 ${id} 的反馈记录？`)) return;
            const res = await fetch('/api/admin/feedbacks/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids: [id] }) });
            if(res.ok){ await query(); await refreshStats(); }
        }

        // 初次加载
        (async ()=>{
            initBackgroundParticles();
            await query();
            await refreshStats();
        })();
    </script>
    <link rel="stylesheet" href="static/target-cursor.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="static/target-cursor.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        initTargetCursor({ targetSelector: 'a, button, .cursor-target', spinDuration: 2, hideDefaultCursor: true });
      });
    </script>
</body>
</html>
