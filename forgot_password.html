<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找回密码</title>
    <style>
        :root {
            --base-unit: min(1.6vh, 1.2vw);
            --primary: #00c6ff;
            --primary-dark: #0072ff;
            --accent: #00ffcc;
            --bg-dark: #0a192f;
            --bg-darker: #020c1b;
            --card-bg: rgba(10, 25, 47, 0.92);
            --text-primary: #e6f1ff;
            --text-secondary: #a8b2d1;
            --border: rgba(0, 198, 255, 0.25);
            --shadow: 0 8px 32px rgba(0, 114, 255, 0.12);
            --radius: 12px;
            --radius-lg: 16px;
            --transition: all 0.25s ease;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-darker);
            min-height: 100vh;
            color: var(--text-primary);
            font-size: calc(var(--base-unit) * 1.2);
            line-height: 1.6;
        }
        .page-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
        }
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 198, 255, 0.12) 0%, transparent 50%),
                        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(0, 114, 255, 0.1) 0%, transparent 50%),
                        linear-gradient(180deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
        }
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(0, 198, 255, 0.04) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 198, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
        }
        .particles-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 198, 255, 0.6);
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.5; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }
        .form-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow), 0 0 60px rgba(0, 198, 255, 0.08);
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            padding: 40px;
            position: relative;
            z-index: 1;
        }
        .form-title {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }
        .form-desc {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 520px) {
            .form-desc { white-space: normal; text-overflow: clip; }
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            transition: var(--transition);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }
        .form-group input::placeholder { color: rgba(168, 178, 209, 0.6); }
        .row-inline {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .row-inline .form-group { flex: 1; margin-bottom: 0; }
        .btn-send {
            padding: 12px 18px;
            background: rgba(0, 198, 255, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }
        .btn-send:hover:not(:disabled) { background: rgba(0, 198, 255, 0.3); }
        .btn-send:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }
        .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }
        .msg {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
        .msg.success { background: rgba(0, 255, 136, 0.12); border: 1px solid rgba(0, 255, 136, 0.3); color: #00ff88; }
        .msg.error { background: rgba(255, 68, 68, 0.12); border: 1px solid rgba(255, 68, 68, 0.3); color: #ff6b6b; }
        .links {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            margin: 0 8px;
        }
        .links a:hover { text-decoration: underline; }
        .links span { color: var(--text-secondary); }
        .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
    </style>

<script src="static/mock-api.js"></script>
</head>
<body>
    <div class="page-wrap">
        <div class="bg-layer"></div>
        <div class="grid-bg"></div>
        <div class="particles-bg" id="particlesBg"></div>
        <div class="form-card">
            <h1 class="form-title">找回密码</h1>
            <p class="form-desc" title="请填写用户名与已绑定的邮箱，验证码将发送到该邮箱。">请填写用户名与已绑定的邮箱，验证码将发送到该邮箱。</p>
            <form id="fpForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required placeholder="请输入您的用户名" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="email">邮箱（接收验证码）</label>
                    <input type="email" id="email" name="email" required placeholder="请输入已绑定的邮箱" autocomplete="email">
                    <div class="hint">须为该账号在「绑定邮箱」中已验证的邮箱</div>
                </div>
                <div class="form-group">
                    <label for="code">验证码</label>
                    <div class="row-inline">
                        <div class="form-group">
                            <input type="text" id="code" name="code" required placeholder="6 位验证码" maxlength="6" autocomplete="one-time-code">
                        </div>
                        <button type="button" id="sendCodeBtn" class="btn-send">发送验证码</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="new_password">新密码</label>
                    <input type="password" id="new_password" name="new_password" required placeholder="至少 6 位" minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm_password">确认新密码</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="再次输入新密码" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="old_password">旧密码（选填）</label>
                    <input type="password" id="old_password" name="old_password" placeholder="若记得可填写以辅助验证" autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">提交重置</button>
                <div id="message" class="msg" style="display:none;"></div>
            </form>
            <div class="links">
                <a href="login.html">返回登录</a>
                <span>|</span>
                <a href="register.html">没有账号？去注册</a>
                <span>|</span>
                <a href="bind_email.html">绑定邮箱</a>
            </div>
        </div>
    </div>
    <script>
        (function initParticles() {
            const container = document.getElementById('particlesBg');
            const count = Math.min(40, Math.floor(window.innerWidth / 18));
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 12 + 8) + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(p);
            }
        })();
        const form = document.getElementById('fpForm');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const messageDiv = document.getElementById('message');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const codeInput = document.getElementById('code');

        function showMsg(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'msg ' + type;
            messageDiv.style.display = 'block';
        }

        sendCodeBtn.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            if (!username) {
                showMsg('请先填写用户名', 'error');
                return;
            }
            if (!email) {
                showMsg('请先填写邮箱', 'error');
                return;
            }
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '发送中…';
            try {
                const res = await fetch('/api/send_code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg(data.message || '验证码已发送，请查收邮件', 'success');
                    let n = 60;
                    const t = setInterval(() => {
                        if (n <= 0) {
                            clearInterval(t);
                            sendCodeBtn.disabled = false;
                            sendCodeBtn.textContent = '发送验证码';
                            return;
                        }
                        sendCodeBtn.textContent = '重发(' + n + 's)';
                        n--;
                    }, 1000);
                } else {
                    showMsg(data.error || '发送失败', 'error');
                    sendCodeBtn.disabled = false;
                    sendCodeBtn.textContent = '发送验证码';
                }
            } catch (e) {
                showMsg('网络错误，请稍后重试', 'error');
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '发送验证码';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const email = emailInput.value.trim();
            const code = codeInput.value.trim();
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const old_password = document.getElementById('old_password').value;
            if (new_password !== confirm_password) {
                showMsg('两次输入的新密码不一致', 'error');
                return;
            }
            if (new_password.length < 6) {
                showMsg('新密码至少 6 位', 'error');
                return;
            }
            try {
                const res = await fetch('/api/reset_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        code,
                        new_password,
                        old_password: old_password || undefined
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    showMsg(data.message || '密码重置成功，请使用新密码登录', 'success');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    showMsg(data.error || '重置失败，请检查输入', 'error');
                }
            } catch (e) {
                showMsg('网络错误，请稍后重试', 'error');
            }
        });
    </script>
</body>
</html>
