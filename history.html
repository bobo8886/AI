<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>历史记录 - 河流污染监测系统</title>
<style>
:root {
  --base-unit: min(1.6vh, 1.2vw);
  --primary-color: #00c6ff;
  --secondary-color: #0072ff;
  --accent-color: #00ffcc;
  --bg-dark: #0a192f;
  --bg-darker: #020c1b;
  --card-bg: rgba(10, 25, 47, 0.8);
  --card-glass: rgba(100, 150, 255, 0.1);
  --text-primary: #e6f1ff;
  --text-secondary: #ccd6f6;
  --card-shadow: 0 8px 32px rgba(0, 114, 255, 0.1);
  --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  --glow: 0 0 10px rgba(0, 198, 255, 0.7);
}
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
  background: var(--bg-darker);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}
.background {
  position: fixed;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  z-index: 0;
  overflow: hidden;
}
.tech-bg {
  position: absolute;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%),
    linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%);
  filter: blur(20px);
  opacity: 0.8;
  z-index: 1;
  will-change: transform;
  animation: bgPulse 10s ease-in-out infinite;
}
@keyframes bgPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.grid-lines {
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: 2;
  opacity: 0.3;
  animation: gridMove 20s linear infinite;
  will-change: transform;
}
@keyframes gridMove {
  0% { transform: translateY(0); }
  100% { transform: translateY(40px); }
}
/* 粒子动画样式 */
.particles-container {
  position: absolute;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
}
.particle {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0, 198, 255, 0.8) 0%, rgba(0, 198, 255, 0.3) 50%, transparent 100%);
  box-shadow: 0 0 6px rgba(0, 198, 255, 0.6);
  animation: particleFloat 15s linear infinite;
}
.particle:nth-child(odd) {
  background: radial-gradient(circle, rgba(0, 255, 204, 0.6) 0%, rgba(0, 255, 204, 0.2) 50%, transparent 100%);
  box-shadow: 0 0 6px rgba(0, 255, 204, 0.5);
  animation-duration: 20s;
}
.particle:nth-child(3n) {
  background: radial-gradient(circle, rgba(0, 114, 255, 0.7) 0%, rgba(0, 114, 255, 0.25) 50%, transparent 100%);
  box-shadow: 0 0 6px rgba(0, 114, 255, 0.4);
  animation-duration: 25s;
}
@keyframes particleFloat {
  0% {
    transform: translateY(100vh) translateX(0) scale(0);
    opacity: 0;
  }
  10% {
    opacity: 1;
    transform: translateY(90vh) translateX(10px) scale(1);
  }
  90% {
    opacity: 1;
    transform: translateY(10vh) translateX(-10px) scale(1);
  }
  100% {
    transform: translateY(-10vh) translateX(0) scale(0);
    opacity: 0;
  }
}
/* 连接线效果 */
.particle-connection {
  position: absolute;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(0, 198, 255, 0.3) 50%, transparent 100%);
  transform-origin: left center;
  opacity: 0;
  animation: connectionFade 3s ease-in-out infinite;
}
@keyframes connectionFade {
  0%, 100% { opacity: 0; }
  50% { opacity: 1; }
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px;
  position: relative;
  z-index: 10;
  animation: fadeIn 0.8s ease-out;
}
.page-title {
  text-align: center;
  color: var(--text-primary);
  font-size: 2.5em;
  margin-bottom: 40px;
  text-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
}
.section-title {
  color: var(--primary-color);
  font-size: 1.5em;
  margin: 2.5rem 0 1.2rem 0;
  text-align: left;
}
.record-list {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.record-card {
  background: linear-gradient(135deg, var(--card-glass), rgba(0, 114, 255, 0.2));
  border-radius: 16px;
  box-shadow: var(--card-shadow);
  border: 1px solid rgba(0, 198, 255, 0.2);
  padding: 1.5rem 2rem;
  transition: var(--transition);
  position: relative;
  backdrop-filter: blur(8px);
  color: var(--text-primary);
}
.record-card:hover {
  transform: translateY(-5px) scale(1.01);
  box-shadow: 0 8px 24px rgba(0, 198, 255, 0.18);
  border-color: var(--accent-color);
}
.record-meta {
  color: var(--text-secondary);
  font-size: 0.95em;
  margin-bottom: 0.5em;
}
.record-content {
  font-size: 1.1em;
  line-height: 1.7;
  margin-bottom: 0.5em;
  white-space: pre-wrap;
  word-break: break-word;
}
.back-btn {
  display: inline-block;
  margin-bottom: 2rem;
  background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
  color: #fff;
  border: none;
  padding: 10px 28px;
  border-radius: 25px;
  cursor: pointer;
  font-size: 1.1em;
  transition: var(--transition);
  text-decoration: none;
  box-shadow: 0 4px 15px rgba(0, 198, 255, 0.18);
}
.back-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0, 198, 255, 0.25);
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 768px) {
  .container { padding: 16px; }
  .page-title { font-size: 2em; }
  .record-card { padding: 1rem; }
  .particle { animation-duration: 12s; }
}
</style>

<script src="static/mock-api.js"></script>
</head>
<body>
<div class="background">
  <div class="tech-bg"></div>
  <div class="grid-lines"></div>
  <div class="particles-container" id="particlesContainer"></div>
</div>
<div class="container">
  <a href="Untitled-1.html" class="back-btn">← 返回首页</a>
  <h1 class="page-title">历史记录</h1>
  <div class="record-list" id="mergedList"></div>
</div>
<script>
// 粒子系统
class ParticleSystem {
  constructor() {
    this.container = document.getElementById('particlesContainer');
    this.particles = [];
    this.connections = [];
    this.maxParticles = 50;
    this.connectionDistance = 150;
    this.init();
  }

  init() {
    this.createParticles();
    this.animate();
    this.createConnections();
  }

  createParticles() {
    for (let i = 0; i < this.maxParticles; i++) {
      this.createParticle();
    }
  }

  createParticle() {
    const particle = document.createElement('div');
    particle.className = 'particle';
    
    // 随机大小
    const size = Math.random() * 4 + 2;
    particle.style.width = size + 'px';
    particle.style.height = size + 'px';
    
    // 随机位置
    particle.style.left = Math.random() * 100 + '%';
    particle.style.animationDelay = Math.random() * 15 + 's';
    
    // 随机动画持续时间
    const duration = 15 + Math.random() * 10;
    particle.style.animationDuration = duration + 's';
    
    this.container.appendChild(particle);
    this.particles.push(particle);
  }

  createConnections() {
    setInterval(() => {
      this.updateConnections();
    }, 100);
  }

  updateConnections() {
    // 清除现有连接线
    this.connections.forEach(conn => conn.remove());
    this.connections = [];

    // 创建新的连接线
    for (let i = 0; i < this.particles.length; i++) {
      for (let j = i + 1; j < this.particles.length; j++) {
        const p1 = this.particles[i];
        const p2 = this.particles[j];
        
        if (this.getDistance(p1, p2) < this.connectionDistance) {
          this.createConnection(p1, p2);
        }
      }
    }
  }

  getDistance(p1, p2) {
    const rect1 = p1.getBoundingClientRect();
    const rect2 = p2.getBoundingClientRect();
    const dx = rect1.left - rect2.left;
    const dy = rect1.top - rect2.top;
    return Math.sqrt(dx * dx + dy * dy);
  }

  createConnection(p1, p2) {
    const connection = document.createElement('div');
    connection.className = 'particle-connection';
    
    const rect1 = p1.getBoundingClientRect();
    const rect2 = p2.getBoundingClientRect();
    
    const dx = rect2.left - rect1.left;
    const dy = rect2.top - rect1.top;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    
    connection.style.left = rect1.left + 'px';
    connection.style.top = rect1.top + 'px';
    connection.style.width = distance + 'px';
    connection.style.transform = `rotate(${angle}deg)`;
    connection.style.animationDelay = Math.random() * 2 + 's';
    
    this.container.appendChild(connection);
    this.connections.push(connection);
  }

  animate() {
    // 定期重新创建粒子以保持动画流畅
    setInterval(() => {
      if (this.particles.length < this.maxParticles) {
        this.createParticle();
      }
    }, 2000);
  }
}

// 页面加载完成后初始化粒子系统
document.addEventListener('DOMContentLoaded', function() {
  new ParticleSystem();
});

function formatDate(str) {
  const d = new Date(str);
  return d.toLocaleString('zh-CN', {
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  });
}
fetch('/api/history').then(res => res.json()).then(data => {
  const mergedList = document.getElementById('mergedList');
  const allItems = [];
  
  // 添加分析结果
  data.analysis.forEach(item => {
    allItems.push({
      type: 'analysis',
      time: item.analysis_time,
      data: item
    });
  });
  
  // 添加反馈
  data.feedbacks.forEach(item => {
    allItems.push({
      type: 'feedback',
      time: item.created_at,
      data: item
    });
  });
  
  // 按时间排序（最新的在前）
  allItems.sort((a, b) => new Date(b.time) - new Date(a.time));
  
  function cleanText(value) {
    const str = String(value ?? '');
    const matched = str.match(/[\u4e00-\u9fa50-9，。！？、；：（）【】《》——…￥·\s]+/g);
    if (!matched) return '';
    let text = matched.join('');
    // 逗号/顿号/分号 -> 空格，保留冒号
    text = text.replace(/[，、；]+/g, ' ');
    text = text.replace(/([。！？])+/g, '$1');
    text = text.replace(/\s{2,}/g, ' ');
    return text.trim();
  }

  if (allItems.length === 0) {
    mergedList.innerHTML = '<div class="record-card">暂无历史记录</div>';
  } else {
    allItems.forEach(item => {
      const card = document.createElement('div');
      card.className = 'record-card';
      if (item.type === 'analysis') {
        const meta = document.createElement('div');
        meta.className = 'record-meta';
        meta.textContent = `📊 分析结果 | 时间：${formatDate(item.time)}`;

        const content = document.createElement('div');
        content.className = 'record-content';
        content.textContent = cleanText(item.data.result) || '—';

        card.appendChild(meta);
        card.appendChild(content);

        if (item.data.image_path) {
          const imgWrap = document.createElement('div');
          imgWrap.style.marginTop = '10px';
          imgWrap.innerHTML = `<img src="static/analysis_images/${item.data.image_path}" alt="分析图片" style="max-width:300px;border-radius:8px;border:1px solid rgba(0,198,255,0.2);">`;
          card.appendChild(imgWrap);
        }
      } else {
        card.innerHTML = `
          <div class="record-meta">📝 提交反馈 | 时间：${formatDate(item.time)}</div>
          <div class="record-content">地点：${item.data.location} | 污染等级：${item.data.pollution_level}</div>
          <div class="record-content">内容：${cleanText(item.data.content)}</div>
          ${item.data.image_path ? `<div style="margin-top:10px;"><img src="static/feedback_images/${item.data.image_path}" alt="反馈图片" style="max-width:300px;border-radius:8px;border:1px solid rgba(0,198,255,0.2);"></div>` : ''}
        `;
      }
      mergedList.appendChild(card);
    });
  }
});
</script>
<link rel="stylesheet" href="static/target-cursor.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="static/target-cursor.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    initTargetCursor({ targetSelector: 'a, button, .cursor-target', spinDuration: 2, hideDefaultCursor: true });
  });
</script>
</body>
