<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户反馈管理 - 河流污染监测系统</title>
    <style>
        :root {
            --primary-color: #00c6ff;
            --secondary-color: #0072ff;
            --accent-color: #00ffcc;
            --bg-dark: #0a192f;
            --bg-darker: #020c1b;
            --card-bg: rgba(10, 25, 47, 0.8);
            --text-primary: #e6f1ff;
            --text-secondary: #ccd6f6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg-darker);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }

        .tech-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%);
            filter: blur(20px);
            opacity: 0.8;
            z-index: 1;
            will-change: transform;
            animation: bgPulse 10s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
            opacity: 0.3;
            animation: gridMove 20s linear infinite;
            will-change: transform;
        }

.particle-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 3;
}

.floating-particle {
    position: absolute;
    bottom: -60px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(0, 198, 255, 0.45);
    box-shadow: 0 0 12px rgba(0, 198, 255, 0.25);
    opacity: 0;
    animation: adminFloat linear infinite;
}

@keyframes adminFloat {
    0% { transform: translate3d(0, 0, 0) scale(0.6); opacity: 0; }
    10% { opacity: 0.8; }
    80% { opacity: 0.4; }
    100% { transform: translate3d(35px, -120vh, 0) scale(1.2); opacity: 0; }
}

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        .title {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .feedback-list {
            background: linear-gradient(135deg, var(--card-bg), rgba(0, 114, 255, 0.2));
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 114, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 198, 255, 0.2);
        }

        .feedback-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(0, 198, 255, 0.1);
            transition: all 0.3s ease;
            animation: itemAppear 0.5s ease-out backwards;
        }

        @keyframes itemAppear {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 198, 255, 0.15);
            border-color: rgba(0, 198, 255, 0.3);
        }

        .feedback-item.urgent-item {
            border-color: rgba(255, 152, 0, 0.6);
            background: linear-gradient(135deg, rgba(255, 152, 0, 0.12), rgba(255, 87, 34, 0.08));
            box-shadow: 0 0 0 1px rgba(255, 152, 0, 0.25);
        }

        .feedback-item.urgent-item:hover {
            box-shadow: 0 8px 24px rgba(255, 152, 0, 0.25);
        }

        .urgent-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            margin-left: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(255, 152, 0, 0.4);
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .btn-refresh {
            background: rgba(0, 198, 255, 0.15);
            color: var(--primary-color);
            border: 1px solid rgba(0, 198, 255, 0.4);
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background: rgba(0, 198, 255, 0.25);
            border-color: var(--primary-color);
        }

        .btn-delete-one {
            background: rgba(255, 68, 68, 0.12);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.35);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .btn-delete-one:hover {
            background: rgba(255, 68, 68, 0.25);
            color: #ffd3d3;
        }

        .feedback-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .feedback-user {
            color: var(--primary-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .feedback-time {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .feedback-location {
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .feedback-level {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .level-mild {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .level-medium {
            background: rgba(255, 187, 0, 0.1);
            color: #ffbb00;
            border: 1px solid rgba(255, 187, 0, 0.2);
        }

        .level-severe {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid rgba(255, 68, 68, 0.2);
        }

        .level-very-severe {
            background: rgba(255, 0, 0, 0.1);
            color: #ff0000;
            border: 1px solid rgba(255, 0, 0, 0.2);
        }

        .feedback-content {
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
        }

    .user-info {
        position: fixed;
        top: 20px;
        right: 24px;
        z-index: 999;
    }

    .user-info-button {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(0, 198, 255, 0.12), rgba(0, 255, 204, 0.12));
        border: 1px solid rgba(0, 198, 255, 0.25);
        color: #e6f1ff;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
        box-shadow: 0 6px 18px rgba(0, 198, 255, 0.15);
        backdrop-filter: blur(6px);
        transition: all 0.3s ease;
    }

    .user-info:hover .user-info-button,
    .user-info.active .user-info-button {
        border-color: var(--primary-color);
        box-shadow: 0 10px 26px rgba(0, 198, 255, 0.2);
        transform: translateY(-1px);
    }

    .user-info-arrow {
        font-size: 0.9em;
        color: var(--accent-color);
        transition: transform 0.3s ease;
    }

    .user-info.active .user-info-arrow {
        transform: rotate(180deg);
    }

    .dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        background: linear-gradient(150deg, rgba(10,25,47,0.98), rgba(10,25,47,0.95));
        border: 1px solid rgba(0, 198, 255, 0.2);
        border-radius: 14px;
        padding: 6px;
        min-width: 190px;
        box-shadow: 0 12px 32px rgba(0, 198, 255, 0.18);
        transform-origin: top right;
        transform: scale(0.95);
        opacity: 0;
        visibility: hidden;
        transition: all 0.25s ease;
    }

    .user-info.active .dropdown {
        transform: scale(1);
        opacity: 1;
        visibility: visible;
    }

    .dropdown-btn {
        width: 100%;
        background: none;
        border: none;
        color: #00c6ff;
        font-size: 0.95em;
        padding: 10px 12px;
        cursor: pointer;
        border-radius: 10px;
        transition: all 0.2s ease;
        text-align: left;
        font-weight: 500;
    }

    .dropdown-btn:hover {
        background: rgba(0,198,255,0.12);
        color: #00ffcc;
        transform: translateX(4px);
    }

    .dropdown-btn.logout {
        color: #ff6b6b;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        margin-top: 4px;
        padding-top: 14px;
    }

    .dropdown-btn.logout:hover {
        background: rgba(255,68,68,0.12);
        color: #ffd3d3;
    }

        .no-feedback {
            text-align: center;
            color: var(--text-secondary);
            padding: 2rem;
            font-size: 1.1rem;
        }
    </style>

<script src="static/mock-api.js"></script>
</head>
<body>
    <div class="background">
        <div class="tech-bg"></div>
        <div class="grid-lines"></div>
        <div class="particle-layer" id="bgParticles"></div>
    </div>

    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.location.href='admin.html'">
                ← 返回管理面板
            </button>
            <h1 class="title">用户反馈管理</h1>
            <p class="subtitle">查看用户提交的污染反馈信息</p>
        </div>

        <div class="toolbar">
            <button type="button" class="btn-refresh" id="btnRefresh" title="刷新列表">
                <span>🔄</span> 刷新
            </button>
        </div>

        <div class="feedback-list" id="feedbackList">
            <!-- 反馈列表将通过 JavaScript 动态生成 -->
        </div>
    </div>


    <script>

        // 获取反馈列表
        function loadFeedbacks() {
            fetch('/api/admin/feedbacks')
                .then(res => res.json())
                .then(feedbacks => {
                    const feedbackList = document.getElementById('feedbackList');
                    
                    if (feedbacks.length === 0) {
                        feedbackList.innerHTML = '<div class="no-feedback">暂无用户反馈</div>';
                        return;
                    }

                    feedbackList.innerHTML = feedbacks.map((feedback, index) => {
                        const formattedDate = new Date(feedback.created_at).toLocaleString('zh-CN', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: false
                        });
                        
                        let levelClass = '';
                        switch(feedback.pollution_level) {
                            case '轻微':
                                levelClass = 'level-mild';
                                break;
                            case '中等':
                                levelClass = 'level-medium';
                                break;
                            case '严重':
                                levelClass = 'level-severe';
                                break;
                            case '非常严重':
                                levelClass = 'level-very-severe';
                                break;
                        }

                        const urgentBadge = feedback.urgent_contact_admin ? '<span class="urgent-badge">⚠ 紧急联系</span>' : '';
                        const itemClass = feedback.urgent_contact_admin ? 'feedback-item urgent-item' : 'feedback-item';

                        return `
                            <div class="${itemClass}" style="animation-delay: ${index * 0.1}s" data-id="${feedback.id}">
                                <div class="feedback-header">
                                    <div class="feedback-user">${feedback.username}${urgentBadge}</div>
                                    <div style="display:flex; align-items:center; gap:10px;">
                                        <button type="button" class="btn-delete-one" data-id="${feedback.id}" title="删除该条记录">删除</button>
                                        <div class="feedback-time">${formattedDate}</div>
                                    </div>
                                </div>
                                <div class="feedback-location">📍 ${feedback.location}</div>
                                <div class="feedback-level ${levelClass}">${feedback.pollution_level}</div>
                                <div class="feedback-content">${feedback.content}</div>
                                ${feedback.image_path ? `<div style="margin-top:10px;"><img src="static/feedback_images/${feedback.image_path}" alt="反馈图片" style="max-width:400px;max-height:300px;object-fit:contain;border-radius:10px;border:1px solid rgba(0,198,255,0.2);box-shadow:0 6px 18px rgba(0,0,0,0.25);"></div>` : ''}
                                <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap">
                                    <span style="color:#99b;">状态：</span>
                                    <select class="status-select" data-id="${feedback.id}" style="background:rgba(255,255,255,0.06); color:#e6f1ff; border:1px solid rgba(0,198,255,0.2); border-radius:8px; padding:6px 8px;">
                                        <option ${feedback.status==='待核实'?'selected':''}>待核实</option>
                                        <option ${feedback.status==='已解决'?'selected':''}>已解决</option>
                                        <option ${feedback.status==='未解决'?'selected':''}>未解决</option>
                                    </select>
                                    <input type="text" class="note-input" data-id="${feedback.id}" placeholder="管理员备注（可选）" style="flex:1; min-width:240px; background:rgba(255,255,255,0.06); color:#e6f1ff; border:1px solid rgba(0,198,255,0.2); border-radius:8px; padding:6px 8px;" value="${(feedback.admin_note||'').replace(/"/g, '&quot;')}">
                                    <button class="save-status" data-id="${feedback.id}" style="background:rgba(0,198,255,0.12); color:#e6f1ff; border:1px solid rgba(0,198,255,0.3); padding:6px 10px; border-radius:8px; cursor:pointer;">保存</button>
                                </div>
                            </div>
                        `;
                    }).join('');

                    // 绑定保存事件
                    document.querySelectorAll('.save-status').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const id = Number(btn.getAttribute('data-id'));
                            const status = document.querySelector(`.status-select[data-id="${id}"]`).value;
                            const note = document.querySelector(`.note-input[data-id="${id}"]`).value;
                            const res = await fetch('/api/admin/feedbacks/update', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ids: [id], status: status, admin_note: note })
                            });
                            if(res.ok){ loadFeedbacks(); }
                        });
                    });

                    // 绑定删除事件（单条）
                    document.querySelectorAll('.btn-delete-one').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const id = Number(btn.getAttribute('data-id'));
                            if (!confirm('确定要删除这条反馈记录吗？')) return;
                            const res = await fetch('/api/admin/feedbacks/delete', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                credentials: 'same-origin',
                                body: JSON.stringify({ ids: [id] })
                            });
                            if (res.ok) loadFeedbacks();
                            else alert('删除失败，请重试');
                        });
                    });
                })
                .catch(error => {
                    console.error('获取反馈列表失败:', error);
                    document.getElementById('feedbackList').innerHTML = '<div class="no-feedback">加载失败，请点击刷新重试</div>';
                });
        }

        // 刷新按钮
        document.getElementById('btnRefresh').addEventListener('click', () => {
            document.getElementById('btnRefresh').disabled = true;
            loadFeedbacks();
            setTimeout(() => { document.getElementById('btnRefresh').disabled = false; }, 500);
        });

        // 页面加载时获取反馈列表
        loadFeedbacks();

        // 每30秒刷新一次反馈列表
        setInterval(loadFeedbacks, 30000);

function initBackgroundParticles() {
    const layer = document.getElementById('bgParticles');
    if (!layer) return;
    layer.innerHTML = '';
    const count = Math.min(120, Math.floor(window.innerWidth / 18));
    for (let i = 0; i < count; i++) {
        const particle = document.createElement('span');
        particle.className = 'floating-particle';
        const size = Math.random() * 6 + 3;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.animationDuration = `${Math.random() * 10 + 9}s`;
        particle.style.animationDelay = `${Math.random() * 6}s`;
        layer.appendChild(particle);
    }
}

document.addEventListener('DOMContentLoaded', initBackgroundParticles);
    </script>
    <link rel="stylesheet" href="static/target-cursor.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="static/target-cursor.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        initTargetCursor({ targetSelector: 'a, button, .cursor-target', spinDuration: 2, hideDefaultCursor: true });
      });
    </script>
</body>
</html>
