<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河流污染分析 - 拍照上传</title>
    <style>
        :root {
            --primary-color: #00c6ff;
            --secondary-color: #0072ff;
            --accent-color: #00ffcc;
            --bg-dark: #0a192f;
            --bg-darker: #020c1b;
            --card-bg: rgba(10, 25, 47, 0.8);
            --text-primary: #e6f1ff;
            --text-secondary: #ccd6f6;
            --success-color: #00ff88;
            --warning-color: #ffbb00;
            --danger-color: #ff4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: var(--bg-darker);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .back-btn {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        .title {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .upload-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 114, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 198, 255, 0.1);
        }

        .upload-area {
            border: 2px dashed var(--primary-color);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 198, 255, 0.05);
            transform: translateZ(0);
            will-change: transform, background;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .upload-area:hover {
            transform: translateY(-4px) scale(1.02) translateZ(0);
            background: rgba(0, 198, 255, 0.15);
        }

        .upload-area.dragover {
            background: rgba(0, 198, 255, 0.2);
            border-color: var(--accent-color);
        }

        .upload-icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .preview-section {
            display: none;
            margin-top: 2rem;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.2);
            transform: translateZ(0);
            will-change: transform;
            transition: all 0.3s ease;
        }

        .analysis-results {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 198, 255, 0.1);
            text-align: left; /* 结果整体左对齐，不居中显示 */
        }

        .feedback-section {
            margin-top: 1.5rem;
            text-align: center;
            display: none;
        }

        .feedback-form {
            margin: 1rem auto 0;
            max-width: 620px;
            background: rgba(0, 198, 255, 0.06);
            border: 1px solid rgba(0, 198, 255, 0.2);
            border-radius: 14px;
            padding: 18px 18px 20px;
            box-shadow: 0 8px 24px rgba(0, 114, 255, 0.12);
        }

        .feedback-form .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .feedback-form label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .feedback-form input,
        .feedback-form select,
        .feedback-form textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(0, 198, 255, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            box-sizing: border-box;
        }

        .feedback-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .feedback-image-preview {
            width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            max-height: 240px;
            object-fit: contain;
            border: 1px solid rgba(0, 198, 255, 0.2);
            background: rgba(0, 198, 255, 0.04);
        }

        .analysis-results h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 198, 255, 0.3);
        }

        .results-grid {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .result-item {
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.08), rgba(0, 114, 255, 0.05));
            border: 1px solid rgba(0, 198, 255, 0.2);
            border-radius: 14px;
            padding: 1.4rem 1.6rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .result-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary-color), var(--accent-color));
            opacity: 0.6;
        }

        .result-item:hover {
            transform: translateX(6px);
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.15), rgba(0, 114, 255, 0.1));
            border-color: rgba(0, 198, 255, 0.4);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.15);
        }

        .result-label {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 1.05rem;
            margin-bottom: 0.8rem;
        }

        .result-label-icon {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .result-value {
            padding: 0.9rem 1.2rem;
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.6;
            word-break: break-word;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-value.status-good {
            background: rgba(0, 255, 136, 0.15);
            border-color: rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .result-value.status-warning {
            background: rgba(255, 187, 0, 0.15);
            border-color: rgba(255, 187, 0, 0.3);
            color: #ffbb00;
        }

        .result-value.status-danger {
            background: rgba(255, 68, 68, 0.15);
            border-color: rgba(255, 68, 68, 0.3);
            color: #ff4444;
        }

        .result-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.12), rgba(0, 255, 204, 0.08));
            border-radius: 14px;
            border: 1px solid rgba(0, 198, 255, 0.25);
        }

        .summary-item {
            text-align: center;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .summary-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .summary-value {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .btn {
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transform: translateZ(0);
            will-change: transform, box-shadow;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05) translateZ(0);
            box-shadow: 0 8px 25px rgba(0, 198, 255, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }

        .loading-spinner {
            border: 4px solid rgba(0, 198, 255, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            will-change: transform;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #camera {
            display: none;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        .camera-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .info-section {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 198, 255, 0.1);
        }

        .info-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid rgba(0, 198, 255, 0.1);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-icon {
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .status-good {
            background: rgba(0, 255, 136, 0.2);
            color: var(--success-color);
        }

        .status-warning {
            background: rgba(255, 187, 0, 0.2);
            color: var(--warning-color);
        }

        .status-danger {
            background: rgba(255, 68, 68, 0.2);
            color: var(--danger-color);
        }

        /* 粒子特效相关样式 */
        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            overflow: hidden;
        }

        .tech-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.15) 0%, transparent 40%),
                linear-gradient(to bottom, var(--bg-darker) 0%, var(--bg-dark) 100%);
            filter: blur(20px);
            opacity: 0.8;
            will-change: transform;
            animation: bgPulse 10s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .grid-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 198, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 198, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 2;
            opacity: 0.3;
            animation: gridMove 20s linear infinite;
            will-change: transform;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        .tech-particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 198, 255, 0.8);
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.7);
            animation: tech-float linear infinite;
            z-index: 3;
        }

        @keyframes tech-float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        .connection-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 198, 255, 0.5), transparent);
            transform-origin: left center;
            animation: pulse 2s infinite alternate;
            z-index: 2;
        }

        @keyframes pulse {
            0% { opacity: 0.2; }
            100% { opacity: 0.8; }
        }

        /* 高级粒子特效 */
        .water-ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, 
                rgba(0, 198, 255, 0.3) 0%, 
                rgba(0, 114, 255, 0.2) 50%,
                transparent 70%
            );
            box-shadow: 0 0 20px rgba(0, 198, 255, 0.2);
            transform: scale(0);
            animation: ripple 4s linear infinite;
            z-index: 2;
        }

        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 0.5;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .flowing-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: linear-gradient(90deg,
                transparent,
                rgba(0, 198, 255, 0.8),
                transparent
            );
            box-shadow: 0 0 15px rgba(0, 198, 255, 0.5);
            border-radius: 50%;
            animation: flow 8s linear infinite;
            z-index: 3;
        }

        @keyframes flow {
            0% {
                transform: translateX(-100%) translateY(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateX(100vw) translateY(100px);
                opacity: 0;
            }
        }

        .pollution-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: linear-gradient(45deg,
                rgba(255, 68, 68, 0.6),
                rgba(255, 187, 0, 0.6)
            );
            box-shadow: 0 0 12px rgba(255, 68, 68, 0.4);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }
            50% {
                transform: translateY(-20px) translateX(10px);
            }
        }

        .water-surface {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                rgba(0, 198, 255, 0.15) 0%,
                rgba(0, 114, 255, 0.1) 50%,
                rgba(0, 198, 255, 0.15) 100%
            );
            backdrop-filter: blur(5px);
            z-index: 1;
            animation: surface-wave 8s ease-in-out infinite;
        }

        @keyframes surface-wave {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(10px);
            }
        }

        /* 高级科技粒子特效 */
        .tech-circle {
            position: absolute;
            border: 1px solid rgba(0, 198, 255, 0.3);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
            z-index: 2;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .data-stream {
            position: absolute;
            color: rgba(0, 198, 255, 0.6);
            font-family: monospace;
            font-size: 12px;
            white-space: nowrap;
            animation: dataFlow 8s linear infinite;
            z-index: 3;
        }

        @keyframes dataFlow {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        .tech-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 198, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 198, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        .energy-pulse {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center,
                rgba(0, 198, 255, 0.1) 0%,
                transparent 70%
            );
            animation: pulse 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .tech-node {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-color);
            animation: nodePulse 2s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes nodePulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        .water-quality-indicator {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg,
                rgba(0, 255, 136, 0.1) 0%,
                rgba(255, 187, 0, 0.1) 50%,
                rgba(255, 68, 68, 0.1) 100%
            );
            opacity: 0.3;
            z-index: 1;
        }

        /* 优化现有特效 */
        .tech-circle {
            border-width: 2px;
            box-shadow: 
                0 0 20px rgba(0, 198, 255, 0.3),
                inset 0 0 20px rgba(0, 198, 255, 0.2);
        }

        .data-stream {
            text-shadow: 
                0 0 5px rgba(0, 198, 255, 0.5),
                0 0 10px rgba(0, 198, 255, 0.3);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .tech-grid {
            background-size: 40px 40px;
            opacity: 0.6;
            transform: perspective(1000px) rotateX(60deg);
        }

        .energy-pulse {
            background: radial-gradient(circle at center,
                rgba(0, 198, 255, 0.3) 0%,
                rgba(0, 114, 255, 0.2) 40%,
                transparent 70%
            );
            filter: blur(10px);
        }

        .tech-node {
            width: 8px;
            height: 8px;
            box-shadow: 
                0 0 15px var(--primary-color),
                inset 0 0 10px var(--primary-color);
        }

        .water-ripple {
            background: radial-gradient(circle,
                rgba(0, 198, 255, 0.4) 0%,
                rgba(0, 114, 255, 0.3) 40%,
                transparent 70%
            );
            box-shadow: 
                0 0 20px rgba(0, 198, 255, 0.3),
                inset 0 0 20px rgba(0, 198, 255, 0.2);
        }

        .flowing-particle {
            background: linear-gradient(90deg,
                transparent,
                rgba(0, 198, 255, 0.9),
                transparent
            );
            box-shadow: 
                0 0 15px rgba(0, 198, 255, 0.6),
                inset 0 0 10px rgba(0, 198, 255, 0.4);
        }

        .pollution-particle {
            background: linear-gradient(45deg,
                rgba(255, 68, 68, 0.7),
                rgba(255, 187, 0, 0.7)
            );
            box-shadow: 
                0 0 15px rgba(255, 68, 68, 0.5),
                inset 0 0 10px rgba(255, 68, 68, 0.3);
        }

        /* 成就按钮样式 */
        .achievement-button {
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .achievement-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.4);
        }

        .achievement-button:active {
            transform: translateY(1px);
        }

        .achievement-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
        }

        .achievement-button:hover::before {
            left: 100%;
        }

        .achievement-icon {
            font-size: 1.2em;
            animation: float 3s ease-in-out infinite;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        /* 优化页面切换动画 */
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-darker);
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .page-transition.active {
            transform: translateY(0);
        }

        /* 优化响应式布局 */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .upload-section, .info-section {
                padding: 1.5rem;
            }
            
            .preview-image {
                max-height: 300px;
            }
        }
    </style>

<script src="static/mock-api.js"></script>
</head>
<body>
    <div class="background">
        <div class="tech-bg"></div>
        <div class="grid-lines"></div>

    <script>
        // 成就系统数据
        const achievements = {
            riverGuardian: { id: 'riverGuardian', name: '河流守护者', target: 5, current: 0 },
            pollutionDetective: { id: 'pollutionDetective', name: '污染侦探', target: 10, current: 0 },
            dataAnalyst: { id: 'dataAnalyst', name: '数据分析师', target: 20, current: 0 },
            ecoPioneer: { id: 'ecoPioneer', name: '环保先锋', target: 30, current: 0 },
            communityContributor: { id: 'communityContributor', name: '社区贡献者', target: 50, current: 0 }
        };

        // 初始化成就数据
        function initAchievements() {
            const savedData = localStorage.getItem('achievements');
            if (savedData) {
                const data = JSON.parse(savedData);
                Object.keys(data).forEach(key => {
                    if (achievements[key]) {
                        achievements[key].current = data[key].current;
                    }
                });
            }
        }

        // 更新成就进度
        function updateAchievementProgress(type) {
            const savedData = localStorage.getItem('achievements') || '{}';
            const data = JSON.parse(savedData);
            
            // 更新分析次数
            if (!data.totalAnalysis) data.totalAnalysis = 0;
            data.totalAnalysis++;
            
            // 更新连续监测天数
            const lastAnalysisDate = data.lastAnalysisDate;
            const today = new Date().toDateString();
            if (lastAnalysisDate === today) {
                // 同一天不更新
            } else if (lastAnalysisDate && new Date(lastAnalysisDate).getTime() + 86400000 === new Date(today).getTime()) {
                // 连续天数+1
                data.consecutiveDays = (data.consecutiveDays || 0) + 1;
            } else {
                // 重置连续天数
                data.consecutiveDays = 1;
            }
            data.lastAnalysisDate = today;
            
            // 更新各项成就进度
            Object.keys(achievements).forEach(key => {
                if (!data[key]) data[key] = { current: 0 };
                if (key === 'riverGuardian' || key === 'dataAnalyst') {
                    data[key].current++;
                }
            });
            
            // 保存数据
            localStorage.setItem('achievements', JSON.stringify(data));
            
            // 检查是否有新解锁的成就
            checkNewAchievements(data);
        }

        // 检查新解锁的成就
        function checkNewAchievements(data) {
            const newAchievements = [];
            
            Object.keys(achievements).forEach(key => {
                const achievement = achievements[key];
                const current = data[key].current;
                const target = achievement.target;
                
                if (current === target) {
                    newAchievements.push(achievement.name);
                }
            });
            
            if (newAchievements.length > 0) {
                showAchievementUnlocked(newAchievements);
            }
        }

        // 显示成就解锁提示
        function showAchievementUnlocked(achievements) {
            const dialog = document.createElement('dialog');
            dialog.style.cssText = `
                border: none;
                border-radius: 16px;
                padding: 32px;
                background: rgba(10, 25, 47, 0.95);
                box-shadow: 0 8px 32px rgba(0, 114, 255, 0.3);
                border: 1px solid rgba(0, 198, 255, 0.3);
                backdrop-filter: blur(10px);
                color: var(--text-primary);
                max-width: 90%;
                width: 400px;
                text-align: center;
                animation: dialogFadeIn 0.3s ease-out;
            `;
            
            const content = `
                <div style="margin-bottom: 24px;">
                    <div style="font-size: 48px; margin-bottom: 16px; animation: achievementIconFloat 2s ease-in-out infinite;">🏆</div>
                    <h2 style="color: var(--primary-color); margin-bottom: 16px; font-size: 24px; text-shadow: 0 0 10px rgba(0, 198, 255, 0.3);">成就解锁！</h2>
                </div>
                <div style="margin-bottom: 24px;">
                    ${achievements.map(name => `
                        <div style="
                            margin-bottom: 12px;
                            padding: 16px;
                            background: rgba(0, 198, 255, 0.1);
                            border-radius: 12px;
                            border: 1px solid rgba(0, 198, 255, 0.2);
                            backdrop-filter: blur(5px);
                            transition: transform 0.3s ease;
                            animation: achievementItemFadeIn 0.5s ease-out;
                        ">
                            <span style="color: var(--accent-color); font-size: 20px; margin-right: 8px;">🏆</span>
                            <span style="font-size: 18px; font-weight: 500;">${name}</span>
                        </div>
                    `).join('')}
                </div>
                <button onclick="this.closest('dialog').close()" style="
                    background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
                    color: white;
                    border: none;
                    padding: 12px 32px;
                    border-radius: 25px;
                    cursor: pointer;
                    font-size: 16px;
                    font-weight: 500;
                    box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
                    transition: all 0.3s ease;
                    position: relative;
                    overflow: hidden;
                ">确定</button>
            `;
            
            // 添加动画样式
            const style = document.createElement('style');
            style.textContent = `
                @keyframes dialogFadeIn {
                    from { opacity: 0; transform: scale(0.9); }
                    to { opacity: 1; transform: scale(1); }
                }
                
                @keyframes achievementIconFloat {
                    0%, 100% { transform: translateY(0); }
                    50% { transform: translateY(-10px); }
                }
                
                @keyframes achievementItemFadeIn {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                
                dialog button:hover {
                    transform: translateY(-2px);
                    box-shadow: 0 6px 20px rgba(0, 198, 255, 0.4);
                }
                
                dialog button:active {
                    transform: translateY(1px);
                }
                
                dialog button::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: -100%;
                    width: 100%;
                    height: 100%;
                    background: linear-gradient(
                        90deg,
                        transparent,
                        rgba(255, 255, 255, 0.2),
                        transparent
                    );
                    transition: 0.5s;
                }
                
                dialog button:hover::before {
                    left: 100%;
                }
            `;
            
            document.head.appendChild(style);
            dialog.innerHTML = content;
            document.body.appendChild(dialog);
            dialog.showModal();
            
            // 点击背景关闭弹窗
            dialog.addEventListener('click', (e) => {
                if (e.target === dialog) {
                    dialog.close();
                }
            });
        }

        // 在分析完成后调用
        function onAnalysisComplete() {
            updateAchievementProgress();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initAchievements();
            fetch('/api/record_activity', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
            createTechParticles();
            createConnections();
            createWaterRipples();
            createFlowingParticles();
            createPollutionParticles();
            createTechCircles();
            createDataStreams();
            createTechNodes();
            createTechOrbs();
            createDataRings();
            createTechBeams();
            createTechRipples();
            createTechConnections();
        });

        let stream = null;
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const analysisResults = document.getElementById('analysisResults');
        const resultsContent = document.getElementById('resultsContent');
        const video = document.getElementById('video');
        const camera = document.getElementById('camera');

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImage(file);
            }
        });

        // 处理图片
        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                previewSection.style.display = 'block';
                camera.style.display = 'none';
                if (stream) {
                    stopCamera();
                }
            };
            reader.readAsDataURL(file);
        }

        // 相机功能
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;
                camera.style.display = 'block';
                previewSection.style.display = 'none';
            } catch (err) {
                console.error('相机启动失败:', err);
                alert('无法访问相机，请确保已授予相机权限。');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            camera.style.display = 'none';
        }

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob((blob) => {
                const file = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
                handleImage(file);
            }, 'image/jpeg');
        }

        // 分析图片
        async function analyzeImage() {
            loading.style.display = 'block';
            analysisResults.style.display = 'none';

            try {
                // 获取图片数据
                const imageData = await getImageData(previewImage);
                
                // 调用火山引擎API分析图片
                const analysisResult = await analyzeWaterQualityWithAPI(previewImage.src);
                
                // 显示分析结果
                displayResults(analysisResult);
                
                // 更新成就进度
                updateAchievementProgress();
                
                // 检查是否有新解锁的成就
                const savedData = JSON.parse(localStorage.getItem('achievements') || '{}');
                checkNewAchievements(savedData);

                // 后端计数
                await fetch('/api/increment_analysis', { method: 'POST' });

                // 保存分析结果到数据库（包含图片）
                await fetch('/api/analysis_result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        result: JSON.stringify(analysisResult),
                        image_data: previewImage.src  // 添加图片数据
                    })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.message) {
                        console.log('分析结果已保存');
                    } else {
                        alert('分析结果保存失败: ' + (data.error || '未知错误'));
                    }
                });
            } catch (error) {
                console.error('分析失败:', error);
                alert(error.message || '图片分析失败，请重试。');
            } finally {
                loading.style.display = 'none';
            }
        }

        // 压缩图片以加速API传输
        function compressImage(dataUrl, maxSize, quality) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let { width, height } = img;
                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.round(width * ratio);
                        height = Math.round(height * ratio);
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        // 调用火山引擎API分析水质
        async function analyzeWaterQualityWithAPI(imageBase64) {
            try {
                // 压缩图片：最大边1024px，JPEG质量0.8
                const compressedImage = await compressImage(imageBase64, 1024, 0.8);

                // 15秒超时控制
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch('https://ark.cn-beijing.volces.com/api/v3/responses', {
                    method: 'POST',
                    signal: controller.signal,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer DEMO_API_KEY'
                    },
                    body: JSON.stringify({
                        model: "doubao-seed-2-0-lite-260428",
                        thinking: { type: "disabled" },
                        input: [
                            {
                                role: "user",
                                content: [
                                    {
                                        type: "input_image",
                                        image_url: compressedImage
                                    },
                                    {
                                        type: "input_text",
                                        text: "你是水质分析专家。分析这张河流照片的水质。无论图片是什么内容，都必须只返回一个JSON对象，禁止返回markdown、表格或任何解释文字，以{开头以}结尾。如果图片不是河流或水域，返回{\"waterQuality\":\"未知\",\"pollutionLevel\":\"未知\",\"pollutionTypes\":[],\"transparency\":\"未知\",\"color\":\"未知\",\"visualObservation\":\"图片非水域\",\"possibleCauses\":\"无法判断\",\"suggestions\":\"请拍摄河流照片\",\"score\":0}。各字段必须使用指定可选值原文，不得用同义词：\n- waterQuality(必填): 优秀|良好|轻度污染|中度污染|重度污染|严重污染\n- pollutionLevel(必填): 无污染|轻微|轻度|中度|重度|非常严重\n- pollutionTypes: 数组，如[\"悬浮物\",\"垃圾漂浮物\"]，无污染则[]\n- transparency(必填): 清澈|半透明|浑浊|完全不透明\n- color(必填): 正常|偏绿|偏黄|偏黑|其他异常\n- visualObservation: 可见污染迹象描述\n- possibleCauses: 污染原因分析\n- suggestions: 治理建议\n- score: 0-100整数\n示例:{\"waterQuality\":\"良好\",\"pollutionLevel\":\"轻度\",\"pollutionTypes\":[\"悬浮物\"],\"transparency\":\"半透明\",\"color\":\"偏绿\",\"visualObservation\":\"水体表面可见少量悬浮物\",\"possibleCauses\":\"上游排放导致\",\"suggestions\":\"加强监管\",\"score\":75}"
                                    }
                                ]
                            }
                        ]
                    })
                });

                clearTimeout(timeoutId);

                const data = await response.json();
                let analysis;
                try {
                    let content = '';
                    // /api/v3/responses 返回 output 数组，需找到 type=message 的项
                    if (data.output && Array.isArray(data.output)) {
                        const msgItem = data.output.find(o => o.type === 'message' && o.content);
                        if (msgItem) {
                            const textItem = msgItem.content.find(c => c.type === 'output_text');
                            content = textItem ? textItem.text : '';
                        }
                    }
                    // 兼容旧版 /api/v3/chat/completions 响应格式
                    if (!content && data.choices && data.choices[0]) {
                        content = data.choices[0].message.content || '';
                    }
                    // 去除可能的markdown代码块标记
                    content = content.replace(/```json\s*/gi, '').replace(/```/g, '').trim();
                    const jsonMatch = content.match(/\{[\s\S]*\}/);
                    if (jsonMatch) {
                        analysis = JSON.parse(jsonMatch[0]);
                    } else {
                        analysis = JSON.parse(content);
                    }
                } catch (e) {
                    console.error('解析分析结果失败:', e, '原始响应:', JSON.stringify(data).substring(0, 500));
                    analysis = {
                        waterQuality: '未知',
                        pollutionLevel: '未知',
                        pollutionTypes: [],
                        transparency: '未知',
                        color: '未知',
                        odor: '未知',
                        visualObservation: '无法解析分析结果',
                        possibleCauses: '未知',
                        suggestions: '请重新分析',
                        score: 0
                    };
                }

                // 根据分析结果确定状态（兼容模型可能的同义词变体）
                let status, color;
                const pollutionLevel = (analysis.pollutionLevel || '').trim();
                const waterQuality = (analysis.waterQuality || '').trim();

                if (['无污染', '清洁', '优', '优秀', '良好'].some(v => waterQuality.includes(v) || pollutionLevel.includes(v))) {
                    status = 'good';
                    color = '#00ff88';
                } else if (['轻微', '轻度', '轻度污染'].some(v => waterQuality.includes(v) || pollutionLevel.includes(v))) {
                    status = 'warning';
                    color = '#ffbb00';
                } else {
                    status = 'danger';
                    color = '#ff4444';
                }

                // 构建丰富的结果数组
                const results = [
                    {
                        label: '综合评分',
                        value: `${analysis.score || 0}分`,
                        status: status,
                        color: color
                    },
                    {
                        label: '水质状况',
                        value: analysis.waterQuality || '未知',
                        status: status,
                        color: color
                    },
                    {
                        label: '污染程度',
                        value: analysis.pollutionLevel || '未知',
                        status: status,
                        color: color
                    }
                ];

                // 如果有污染类型，显示
                if (analysis.pollutionTypes && analysis.pollutionTypes.length > 0) {
                    results.push({
                        label: '污染类型',
                        value: Array.isArray(analysis.pollutionTypes) ? analysis.pollutionTypes.join('、') : analysis.pollutionTypes,
                        status: status
                    });
                }

                // 添加水体特征
                if (analysis.transparency) {
                    results.push({
                        label: '透明度',
                        value: analysis.transparency,
                        status: status
                    });
                }

                if (analysis.color) {
                    results.push({
                        label: '水体颜色',
                        value: analysis.color,
                        status: status
                    });
                }

                // 添加视觉观察
                if (analysis.visualObservation) {
                    results.push({
                        label: '视觉观察',
                        value: analysis.visualObservation,
                        status: status
                    });
                }

                // 添加可能原因
                if (analysis.possibleCauses) {
                    results.push({
                        label: '可能原因',
                        value: analysis.possibleCauses,
                        status: status
                    });
                }

                // 添加建议措施
                if (analysis.suggestions) {
                    results.push({
                        label: '建议措施',
                        value: analysis.suggestions,
                        status: status
                    });
                    }

                return results;
            } catch (error) {
                if (error.name === 'AbortError') {
                    throw new Error('分析超时，请稍后重试');
                }
                console.error('API调用失败:', error);
                throw new Error('图片分析服务暂时不可用，请稍后重试');
            }
        }

        // 获取图片数据
        function getImageData(imageElement) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = imageElement.naturalWidth;
                canvas.height = imageElement.naturalHeight;
                ctx.drawImage(imageElement, 0, 0);
                resolve(ctx.getImageData(0, 0, canvas.width, canvas.height));
            });
        }

        function cleanText(value) {
            const str = String(value ?? '');
            // 先保留中文、数字和常用标点/空白（保留冒号，用逗号/顿号/分号变空格）
            const matched = str.match(/[\u4e00-\u9fa50-9，。！？、；：（）【】《》——…￥·\s]+/g);
            if (!matched) return '';
            let text = matched.join('');
            // 把逗号、顿号、分号改成空格，冒号保留
            text = text.replace(/[，、；]+/g, ' ');
            // 保留句号/问号/感叹号作为句子结束
            text = text.replace(/([。！？])+/g, '$1');
            // 折叠多余空格
            text = text.replace(/\s{2,}/g, ' ');
            return text.trim();
        }

        function getResultIcon(label) {
            const icons = {
                '综合评分': '📊',
                '水质状况': '💧',
                '污染程度': '⚠️',
                '污染类型': '🔍',
                '透明度': '👁️',
                '水体颜色': '🎨',
                '视觉观察': '👀',
                '可能原因': '💡',
                '建议措施': '✅'
            };
            return icons[label] || '📌';
        }

        function displayResults(results) {
            // 提取前三个关键指标作为摘要
            const summaryItems = results.slice(0, 3);
            const detailItems = results.slice(3);

            let html = '';

            // 摘要区域（前三个指标）
            if (summaryItems.length > 0) {
                html += '<div class="result-summary">';
                html += summaryItems.map(item => {
                    const cleanVal = cleanText(item.value);
                    return `
                        <div class="summary-item">
                            <div class="summary-label">${item.label}</div>
                            <div class="summary-value status-${item.status}" style="color: ${item.color || '#e6f1ff'}">${cleanVal}</div>
                        </div>
                    `;
                }).join('');
                html += '</div>';
            }

            // 详细信息区域
            if (detailItems.length > 0) {
                html += '<div class="results-grid">';
                html += detailItems.map(item => {
                    const cleanVal = cleanText(item.value);
                    return `
                        <div class="result-item">
                            <div class="result-label">
                                <span class="result-label-icon">${getResultIcon(item.label)}</span>
                                <span>${item.label}</span>
                            </div>
                            <div class="result-value status-${item.status}">${cleanVal}</div>
                        </div>
                    `;
                }).join('');
                html += '</div>';
            }

            resultsContent.innerHTML = html;
            analysisResults.style.display = 'block';
            feedbackSection.style.display = 'block';
            updateFeedbackPreview();
        }

        const fbMessage = document.getElementById('fbMessage');

        function updateFeedbackPreview() {
            if (previewImage && fbImagePreview && previewImage.src) {
                fbImagePreview.src = previewImage.src;
            }
        }

        if (feedbackForm) {
            feedbackForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                fbMessage.style.display = 'none';
                const location = document.getElementById('fbLocation').value.trim();
                const level = document.getElementById('fbLevel').value;
                const content = document.getElementById('fbContent').value.trim();
                if (!location || !level || !content || !previewImage.src) {
                    fbMessage.textContent = '请先完成分析并填写完整信息';
                    fbMessage.style.color = '#ff6b6b';
                    fbMessage.style.display = 'block';
                    return;
                }
                const res = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        location,
                        pollution_level: level,
                        content,
                        image_data: previewImage.src
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    fbMessage.textContent = '反馈已提交，感谢您的参与！';
                    fbMessage.style.color = '#00ff88';
                    fbMessage.style.display = 'block';
                    feedbackForm.reset();
                    updateFeedbackPreview();
                } else {
                    fbMessage.textContent = data.error || '提交失败，请稍后重试';
                    fbMessage.style.color = '#ff6b6b';
                    fbMessage.style.display = 'block';
                }
            });
